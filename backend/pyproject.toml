[project]
name = "ochorus-backend"
version = "0.1.0"
description = "Ochorus — a free reader for public-domain Christian classics. Django + DRF API."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.13.0",
    "dj-database-url>=3.1.2",
    "django>=6.0.6",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "lxml>=5.3.0",
    "mammoth>=1.9.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.13.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.2.2",
    "pythonbible>=0.15.0",
    "pythonbible-asv>=0.0.2",
    "requests>=2.34.2",
    "sentry-sdk[django]>=2.20.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
