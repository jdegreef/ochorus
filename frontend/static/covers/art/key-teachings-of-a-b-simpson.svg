<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#256074"/>
      <stop offset="0.5" stop-color="#184b5c"/>
      <stop offset="1" stop-color="#0b2731"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.42">
      <stop offset="0" stop-color="#f3e6c0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f3e6c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.85">
      <stop offset="0.52" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.44"/>
    </radialGradient>
    <linearGradient id="topscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2530" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#0a2530" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1.4" height="4" fill="#000" opacity="0.06"/>
    </pattern>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eeda a8"/>
      <stop offset="0" stop-color="#eedaa8"/>
      <stop offset="1" stop-color="#c2a463"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#sky)"/>
  <circle cx="300" cy="580" r="215" fill="url(#glow)"/>

  <!-- low horizon; sky above kept clear for the title -->
  <path d="M0 726 Q300 700 600 726 L600 800 L0 800 Z" fill="#0a2530" opacity="0.6"/>
  <path d="M0 720 Q300 694 600 720" fill="none" stroke="#eedaa8" stroke-opacity="0.16" stroke-width="2"/>

  <!-- trunk: tall, slender, gently leaning; rooted at the horizon -->
  <path d="M294 724 C289 660 289 606 299 566 C305 606 303 662 308 724 Z" fill="#bd9b5d"/>
  <g stroke="#836c34" stroke-opacity="0.42" stroke-width="1.3" fill="none">
    <path d="M291 706 q11 -4 20 0"/><path d="M291 680 q11 -4 19 0"/>
    <path d="M292 654 q10 -4 17 0"/><path d="M293 628 q9 -4 15 0"/>
    <path d="M295 600 q8 -3 12 0"/>
  </g>

  <!-- crown: feathery fronds on CURVED spines, arching up then drooping at the tips.
       Each frond is a slim leaf drawn out along a curve and back. Crown sits at
       ~y=566, tips reach out and down; top of crown ~y=486 (clear of the subtitle). -->
  <g fill="url(#leaf)">
    <!-- far left, long low droop -->
    <path d="M300 566 C244 556 176 566 120 612 C168 566 150 548 150 548 C210 566 258 556 300 566 Z"/>
    <path d="M300 566 C250 560 200 578 150 620 C196 574 214 560 300 566 Z" opacity="0.9"/>
    <!-- far right, mirror -->
    <path d="M300 566 C356 556 424 566 480 612 C432 566 450 548 450 548 C390 566 342 556 300 566 Z"/>
    <path d="M300 566 C350 560 400 578 450 620 C404 574 386 560 300 566 Z" opacity="0.9"/>
    <!-- mid left / right, arching outward and gently down -->
    <path d="M300 566 C252 542 214 522 182 508 C214 540 238 556 300 566 Z"/>
    <path d="M300 566 C348 542 386 522 418 508 C386 540 362 556 300 566 Z"/>
    <!-- upper left / right, more upright, curving over -->
    <path d="M300 566 C270 528 250 502 236 486 C258 520 276 548 300 566 Z"/>
    <path d="M300 566 C330 528 350 502 364 486 C342 520 324 548 300 566 Z"/>
    <!-- centre pair, tallest but topping out below the subtitle -->
    <path d="M300 566 C292 522 292 500 300 486 C308 500 308 522 300 566 Z"/>
  </g>
  <!-- date cluster nestled in the crown -->
  <g fill="#eedaa8">
    <circle cx="295" cy="572" r="3.1"/><circle cx="305" cy="573" r="3.1"/><circle cx="300" cy="579" r="3.1"/>
  </g>

  <rect width="600" height="800" fill="url(#grain)"/>
  <rect width="600" height="800" fill="url(#vig)"/>
  <rect width="600" height="800" fill="url(#topscrim)"/>
</svg>
