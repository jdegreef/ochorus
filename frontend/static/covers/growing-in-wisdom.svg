<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#252a63"/>
      <stop offset="1" stop-color="#14173a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.78"/>
      <stop offset="0.4" stop-color="#ffe4a6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffe4a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d4" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffe9b8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
