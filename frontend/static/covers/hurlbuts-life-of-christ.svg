      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#432817"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </radialGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1.5" height="4" fill="black" opacity="0.11"/></pattern>
