<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so env(safe-area-inset-*) resolves to the real inset on
		     notched devices; without it the reader's fixed bottom bars sit in the
		     home-indicator strip. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Two media-scoped values so the browser chrome is right before any JS
		     runs. A single static value could only match one theme, and it was
		     the light one while the CSS default (bare :root) is lamplight — so a
		     dark-theme first paint got a cream address bar. The boot script below
		     collapses these to whatever theme actually applies. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ef" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16130f" />
		<link rel="manifest" href="/manifest.json" />
		<!-- Tab icon is the wordmark's own capital O, not the book-and-quill mark.
		     The mark is hairline artwork: at 16px it collapses into an unreadable
		     smudge (checked). The O is from the same logo and stays crisp. The
		     mark is used everywhere it has room — 192px up. -->
		<link rel="icon" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Ochorus" />
		<!-- Page title and description are set per-page via svelte:head; do not add
		     static ones here or they will collide with (and duplicate) those. -->
		<script>
			// Resolve the theme before hydration to avoid a flash. Mirrors
			// $lib/theme.svelte.ts: 'system' follows the OS; 'paper' is legacy light.
			try {
				var pref = localStorage.getItem('theme') || 'system';
				if (pref === 'paper') pref = 'light';
				var applied =
					pref === 'dark' || pref === 'sepia' || pref === 'light'
						? pref
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-theme', applied);
				// The library palette (mirrors $lib/palette.svelte.ts + $lib/palettes).
				// A choice that resolves to another palette (the Church year's
				// season) paints what the app last applied — this script has no
				// calendar; the app corrects it on load. Unresolvable without that
				// cache: no palette entry matches, so the house palette.
				var pal = localStorage.getItem('ochorus:palette-applied') || localStorage.getItem('ochorus:palette');
				var palColors = {
					cathedral: { light: '#f5f6f8', dark: '#10141c' },
					olive: { light: '#f6f5ee', dark: '#121510' },
					hearth: { light: '#fbf4ec', dark: '#1a120e' },
					dawn: { light: '#fbf6f6', dark: '#17121a' },
					monastery: { light: '#f6f6f4', dark: '#141414' },
					violet: { light: '#f7f5fa', dark: '#15121c' },
					feast: { light: '#fcfaf4', dark: '#17150f' },
					flame: { light: '#fbf6f5', dark: '#1a1112' }
				};
				if (palColors[pal]) document.documentElement.setAttribute('data-palette', pal);
				// Match the browser UI (address bar / status bar) to the active theme
				// (and palette; sepia keeps its own ground under every palette).
				var colors = { light: '#faf6ef', dark: '#16130f', sepia: '#f4ecd8' };
				if (palColors[pal] && applied !== 'sepia') colors[applied] = palColors[pal][applied];
				// Drop the media scoping: an explicit theme choice must beat the OS
				// (sepia on an OS-light device, say), and a media-scoped tag that
				// doesn't match would otherwise keep applying.
				var tcs = document.querySelectorAll('meta[name="theme-color"]');
				for (var i = 0; i < tcs.length; i++) {
					tcs[i].removeAttribute('media');
					tcs[i].setAttribute('content', colors[applied] || '#faf6ef');
				}
			} catch (e) {}
			try {
				// The site style, likewise before first paint — its own try, so a
				// theme failure above cannot skip it. Mirrors $lib/siteFont.svelte.ts;
				// the CSS is $lib/site-fonts.css.
				var sf = localStorage.getItem('ochorus:site-font');
				if (sf === 'classic' || sf === 'hyperlegible')
					document.documentElement.setAttribute('data-site-font', sf);
			} catch (e) {}
			// Chrome fires its install offer once, early — often before the app has
			// mounted. Hold it for $lib/install.svelte.ts so it isn't missed, and so
			// Chrome's own mini-infobar doesn't appear at a random moment.
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__ochorusInstall = e;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
