<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so env(safe-area-inset-*) resolves to the real inset on
		     notched devices; without it the reader's fixed bottom bars sit in the
		     home-indicator strip. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The default theme is light whatever the OS says (theme.svelte.ts
		     DEFAULT_PREF), so the browser chrome before any JS runs is the light
		     --bg. The boot script below repaints it for a reader who chose
		     another theme or palette. -->
		<meta name="theme-color" content="#faf6ef" />
		<link rel="manifest" href="/manifest.json" />
		<!-- Tab icon is the wordmark's own capital O, not the book-and-quill mark.
		     The mark is hairline artwork: at 16px it collapses into an unreadable
		     smudge (checked). The O is from the same logo and stays crisp. The
		     mark is used everywhere it has room — 192px up. -->
		<link rel="icon" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Ochorus" />
		<!-- Page title and description are set per-page via svelte:head; do not add
		     static ones here or they will collide with (and duplicate) those. -->
		<script>
			// Resolve the theme before hydration to avoid a flash. Mirrors
			// $lib/theme.svelte.ts: no choice = light (DEFAULT_PREF); 'system'
			// follows the OS; 'paper' is legacy light.
			try {
				var pref = localStorage.getItem('theme') || 'light';
				if (pref === 'paper') pref = 'light';
				var applied =
					pref === 'dark' || pref === 'sepia' || pref === 'light'
						? pref
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-theme', applied);
				// The library palette (mirrors $lib/palette.svelte.ts + $lib/palettes).
				// A choice that resolves to another palette (the Church year's
				// season) paints what the app last applied — this script has no
				// calendar; the app corrects it on load. Unresolvable without that
				// cache: no palette entry matches, so the house palette.
				var pal = localStorage.getItem('ochorus:palette-applied') || localStorage.getItem('ochorus:palette');
				var palColors = {
					cathedral: { light: '#f5f6f8', dark: '#10141c' },
					olive: { light: '#f6f5ee', dark: '#121510' },
					hearth: { light: '#fbf4ec', dark: '#1a120e' },
					dawn: { light: '#fbf6f6', dark: '#17121a' },
					monastery: { light: '#f6f6f4', dark: '#141414' },
					illuminated: { light: '#f7f1e3', dark: '#13141f' },
					violet: { light: '#f7f5fa', dark: '#15121c' },
					feast: { light: '#fcfaf4', dark: '#17150f' },
					flame: { light: '#fbf6f5', dark: '#1a1112' }
				};
				if (palColors[pal]) document.documentElement.setAttribute('data-palette', pal);
				// Match the browser UI (address bar / status bar) to the active theme
				// (and palette; sepia keeps its own ground under every palette).
				var colors = { light: '#faf6ef', dark: '#16130f', sepia: '#f4ecd8' };
				if (palColors[pal] && applied !== 'sepia') colors[applied] = palColors[pal][applied];
				// Drop the media scoping: an explicit theme choice must beat the OS
				// (sepia on an OS-light device, say), and a media-scoped tag that
				// doesn't match would otherwise keep applying.
				var tcs = document.querySelectorAll('meta[name="theme-color"]');
				for (var i = 0; i < tcs.length; i++) {
					tcs[i].removeAttribute('media');
					tcs[i].setAttribute('content', colors[applied] || '#faf6ef');
				}
			} catch (e) {}
			try {
				// The site style, likewise before first paint — its own try, so a
				// theme failure above cannot skip it. Mirrors $lib/siteFont.svelte.ts;
				// the CSS is $lib/site-fonts.css.
				var sf = localStorage.getItem('ochorus:site-font');
				if (sf === 'classic' || sf === 'hyperlegible')
					document.documentElement.setAttribute('data-site-font', sf);
			} catch (e) {}
			try {
				// Whose home page this is, before first paint. The home page is
				// prerendered for a newcomer; a signed-in reader (a Supabase session
				// in storage) is swapped to their dashboard, and a returning one gets
				// "Continue reading" above the hero — both only once the app runs,
				// which moved the whole page down a screen on a phone. Flagged here,
				// the home page shows a member the dashboard's skeleton until the app
				// has mounted, and keeps a returning reader's page visible with the
				// strip's space already held (src/routes/+page.svelte, app.css
				// .home-root, HomeMarketing .home-hold). Mirrors the supabase-js
				// session key and $lib/reading-schema's PROGRESS_KEY, ACTIVITY_KEY
				// and RESUME_BOOKS_KEY. A session counts only when it is one the
				// page will draw the dashboard for ($lib/auth storedSessionUser:
				// a refresh token and a user), or the two disagree.
				var de = document.documentElement;
				var hf = '';
				for (var j = 0; j < localStorage.length; j++) {
					var sk = localStorage.key(j) || '';
					if (!/^sb-.+-auth-token$/.test(sk)) continue;
					try {
						var ss = JSON.parse(localStorage.getItem(sk) || 'null');
						if (ss && typeof ss.refresh_token === 'string' && ss.user) hf = 'member';
					} catch (se) {}
				}
				if (hf) de.setAttribute('data-home-for', hf);
				else {
					// What the strip will draw at mount, so the hold is its size:
					// ContinueReading's slots (unfinished books and sermons, less
					// those this language's last lists lacked — $lib/resumeBooks, at
					// its SCHEMA — at most four), and
					// whether ReadingNudge shows (any reading day), with a streak
					// (read today or yesterday) and read today. The language is the
					// URL's: Paraglide routes by prefix.
					var pr = JSON.parse(localStorage.getItem('ochorus:progress') || '{}') || {};
					var lm = /^\/([a-z]{2,3})(\/|$)/.exec(location.pathname);
					var rb = JSON.parse(localStorage.getItem('ochorus:resume-books') || '{}') || {};
					var ab = ((rb.schema === 3 && rb.absent) || {})[lm ? lm[1] : 'en'] || [];
					var n = 0;
					for (var k in pr)
						if (pr[k] && pr[k].finished_at == null && !/^(bio|article):/.test(k) && ab.indexOf(k) < 0) n++;
					var ds = JSON.parse(localStorage.getItem('ochorus:activity') || '[]');
					var day = function (back) {
						var d = new Date();
						d.setDate(d.getDate() - back);
						var m = d.getMonth() + 1, dd = d.getDate();
						return d.getFullYear() + (m < 10 ? '-0' : '-') + m + (dd < 10 ? '-0' : '-') + dd;
					};
					var nudge = '';
					if (ds && ds.length) {
						nudge = 'on';
						if (ds.indexOf(day(0)) >= 0) nudge += ' streak today';
						else if (ds.indexOf(day(1)) >= 0) nudge += ' streak';
					}
					if (n || nudge) {
						de.setAttribute('data-home-for', 'reader');
						de.setAttribute('data-home-cards', String(Math.min(n, 4)));
						if (nudge) de.setAttribute('data-home-nudge', nudge);
					}
				}
			} catch (e) {}
			// Chrome fires its install offer once, early — often before the app has
			// mounted. Hold it for $lib/install.svelte.ts so it isn't missed, and so
			// Chrome's own mini-infobar doesn't appear at a random moment.
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__ochorusInstall = e;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
