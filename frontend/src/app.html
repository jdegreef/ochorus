<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#faf6ef" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Ochorus" />
		<!-- Page title and description are set per-page via svelte:head; do not add
		     static ones here or they will collide with (and duplicate) those. -->
		<script>
			// Resolve the theme before hydration to avoid a flash. Mirrors
			// $lib/theme.svelte.ts: 'system' follows the OS; 'paper' is legacy light.
			try {
				var pref = localStorage.getItem('theme') || 'system';
				if (pref === 'paper') pref = 'light';
				var applied =
					pref === 'dark' || pref === 'sepia' || pref === 'light'
						? pref
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-theme', applied);
				// Match the browser UI (address bar / status bar) to the active theme.
				var colors = { light: '#faf6ef', dark: '#16130f', sepia: '#f4ecd8' };
				var tc = document.querySelector('meta[name="theme-color"]');
				if (tc) tc.setAttribute('content', colors[applied] || '#faf6ef');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
