# Dependabot keeps dependencies watched, not just frozen. The lockfiles (uv.lock,
# package-lock.json) are pinned for reproducibility, which is good — but frozen
# and unwatched means a disclosed CVE in Django, PyJWT or @supabase/supabase-js
# sits unpatched until a human happens to notice. This opens update PRs (and,
# with Dependabot alerts on in the repo's Security settings, security PRs) so a
# vulnerability is surfaced and actionable rather than silent.
#
# Minor + patch updates are grouped per ecosystem into ONE PR so a fast-moving
# main isn't flooded. MAJOR updates are deliberately left out of the group and
# come as their own PRs: a single incompatible major (e.g. typescript 7, which
# svelte-check doesn't yet support) grouped with everything else fails the whole
# batch's `npm ci`/CI and blocks 20+ safe updates. On its own PR, a breaking
# major is reviewed and held or fixed in isolation. Each still runs CI to merge.
version: 2
updates:
  # Python API (uv / pyproject.toml + uv.lock).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # SvelteKit frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The CI / prerender-audit workflows' own action versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
