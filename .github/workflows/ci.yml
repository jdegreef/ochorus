name: CI

# Quality gate for every PR and push to main. Blocks a merge until the backend
# tests + migration check pass and the frontend type-checks and builds. Add this
# workflow as a required status check in the repo's branch-protection settings so
# it actually gates merges (autoDeploy ships main to production).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is the point of this — the older run tests code nobody
  # will merge. On MAIN it is the opposite: cancelling means the merge that was
  # just pushed gets no verdict at all, and main auto-deploys to production.
  # That is not hypothetical. #973 merged on 2026-08-17 and its main run was
  # CANCELLED by #967's and then #974's merging seconds later; the migration
  # drift and the unkeyed {#each} it carried went unreported, and every branch
  # cut from main failed `makemigrations --check` and `eslint` for two days.
  # The failure was eventually visible on #974's run — nothing had reported on
  # #973's own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true' # local SQLite, no external services
    # Throwaway Postgres so the production search path (stored tsvectors,
    # GIN migration, websearch queries) actually runs in CI — the SQLite
    # test run skips every @skipUnless(vendor == "postgresql") test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # --- Backend gate -----------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Backend — check for missing migrations
        working-directory: backend
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Backend — tests
        working-directory: backend
        run: uv run python manage.py test --verbosity 1

      - name: Backend — tests (Postgres, the production search path)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run python manage.py test --verbosity 1

      # The production image was previously unbuilt by CI, so a Dockerfile mistake
      # passed every check and only failed at deploy time (where it takes the API
      # down). Building it proves collectstatic works as the non-root user, but a
      # build alone would not catch the failure that actually matters — the image
      # not SERVING — so this also boots it with the real CMD (gunicorn, as `app`)
      # against the CI Postgres and requires a healthy response.
      - name: Backend — production image builds, runs unprivileged, and serves
        run: |
          docker build -t ochorus-api:ci backend
          user="$(docker run --rm ochorus-api:ci id -un)"
          echo "image runs as: $user"
          test "$user" = "app"
          # Port 8010, not 8000: the prerender API starts on 8000 further down.
          docker run -d --name api-image-smoke --network host \
            -e PORT=8010 \
            -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=ci-image-smoke-not-a-real-secret \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            ochorus-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8010/api/health/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8010/api/health/ \
            || { echo "::error::the production image did not serve"; docker logs api-image-smoke; exit 1; }

      - name: Stop image smoke container
        if: always()
        run: docker rm -f api-image-smoke 2>/dev/null || true

      # The frontend build prerenders pages by fetching the API, so bring a
      # seeded API up locally (mirrors the real Render web build against the API).
      - name: Backend — seed + start API for prerender
        working-directory: backend
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_if_empty
          uv run python manage.py runserver 8000 --noreload &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health/

      # --- Frontend gate ----------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install (locked)
        working-directory: frontend
        run: npm ci

      - name: Frontend — compile i18n messages
        working-directory: frontend
        # Paraglide output ($lib/paraglide) is gitignored (generated), so it must
        # be compiled before svelte-check, which would otherwise fail on the
        # $lib/paraglide/* imports. The build step regenerates it via the Vite plugin.
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Frontend — lint (eslint)
        working-directory: frontend
        run: npx eslint .

      - name: Frontend — type-check
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run check

      - name: Frontend — unit tests
        working-directory: frontend
        run: npm run test

      - name: Frontend — build
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

      # These guards assert on BUILT html, so they have to run after the build —
      # the "Frontend — unit tests" step above runs before build/ exists and
      # skips them. A guard that silently skips is worse than no guard.
      #
      # prerenderCoverage is the one that catches a page the sitemap advertises
      # and the build never produced: the static adapter serves the noindex
      # 200.html shell for those, so they are promised to Google and then
      # refused. It has happened twice (all of /pt and /ar; then 49 localized
      # author and era pages) and both times Search Console found it, not CI.
      - name: Frontend — built-output guards
        working-directory: frontend
        run: npx vitest run src/lib/href.test.ts src/lib/prerenderCoverage.test.ts

      # Browser smoke tests: the only gate that RUNS the app. Everything above is
      # blind to hydration, client-side routing and live API fetches, so a broken
      # frontend/backend contract could pass all of it (the review's drift
      # finding). Serves the build just produced and reuses the API already up.
      # The browser download is the single most expensive thing in this workflow
      # and it was repeated every run. Measured on 2026-08-19: 3m21s on one run
      # and 26m55s on another — 27 of that run's 37 minutes, to enable an
      # 8-second test suite. It is a ~150MB fetch whose speed depends entirely
      # on the CDN that morning, which is why the range is so wide.
      #
      # Slow CI is not just a cost, it is a correctness problem here: #976 was
      # merged four minutes BEFORE its own run finished. A gate people outrun is
      # not a gate.
      #
      # Keyed on the lockfile, so a Playwright version bump re-downloads.
      # restore-keys lets a near-miss reuse the previous browser directory —
      # `playwright install` then fetches only what is actually missing rather
      # than starting from empty.
      - name: Frontend — cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # `--with-deps` is kept unconditionally: it installs OS packages via apt,
      # which the cache above does not cover, and `playwright install` skips the
      # download itself when the cached browser is already present. Dropping it
      # on a cache hit would save ~30s and risk a missing shared library, which
      # is a bad trade for a gate whose whole job is to catch what the other
      # steps cannot see.
      - name: Frontend — install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend — smoke tests (real browser, real API)
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Upload smoke-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Stop the background API before the job's post-steps run — a lingering
      # `uv run … runserver` process makes setup-uv's cache-prune fail (exit 2).
      - name: Stop local API
        if: always()
        run: pkill -f "manage.py runserver" 2>/dev/null || true
