name: CI

# Quality gate for every PR and push to main. Blocks a merge until the backend
# tests + migration check pass, the production image builds & serves, the
# frontend type-checks/builds, and the browser smoke passes. The ONE required
# status check in branch protection is `test-and-build` (the aggregator at the
# bottom) — NOT the individual jobs. That is deliberate: the jobs are path-
# filtered and a skipped job must not block, so only the always-running
# aggregator is required. Do not add the sub-jobs as required contexts.
# (autoDeploy ships main to production.)
#
# Structure: four jobs that run in PARALLEL instead of one serial job.
#   backend-tests   — ruff, migration check, SQLite + Postgres suites
#   backend-image   — production Docker image builds (layer-cached), runs
#                     unprivileged, and serves
#   frontend-checks — eslint, svelte-check, unit tests (no API needed)
#   integration     — seed a local API, build the frontend against it, assert
#                     the built output, run the real-browser smoke
# The four are independent of each other. On a PR they gate on `changes` (a
# ~10s paths filter) so a change only pays for the jobs it can actually break —
# a content-only PR skips the Docker image build and the frontend static checks;
# a frontend-only PR skips the backend suites and the image. See the `changes`
# job for the exact mapping and why `integration` runs on nearly everything.
# On push/main and merge_group NOTHING is filtered — every job runs, because
# main auto-deploys and the merge queue is the last gate before production.
#
# `merge_group` runs this same gate on the merge queue's temporary branch — the PR
# merged onto the CURRENT main (and any PRs ahead of it in the queue). That is what
# finally closes the divergent-migration-leaf race (the 0121->0125 cascade of
# 2026-09-06): a PR whose migration was cut off a now-stale leaf produces two leaf
# nodes on the real merge, so `makemigrations --check` fails HERE and the queue
# ejects it — instead of breaking main and the deploy after it lands. Requires
# "Require merge queue" on the main branch-protection rule to actually take effect.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  # A PUSH TO MAIN GETS ITS OWN GROUP, keyed by commit. Every other event keeps
  # the per-ref group, so a PR's older runs are still superseded by its newer
  # ones and a merge_group run still serialises on its queue branch.
  #
  # `cancel-in-progress: false` is NOT enough on its own to protect main, and
  # that is the whole reason for the sha. GitHub holds at most ONE pending run
  # per concurrency group: when a third run arrives, the one waiting in the
  # queue is CANCELLED to make room for it. So with every main commit sharing
  # `ci-refs/heads/main`, a merge lands, a second waits, and the third evicts
  # the second — no cancel-in-progress required, and no verdict for the commit
  # that got evicted.
  #
  # Measured on 2026-09-16: 18 of the last 30 push-to-main runs ended
  # `cancelled`, i.e. ~60% of merges deployed to production without CI ever
  # reporting on them. This was invisible while main took a handful of merges a
  # day; at ~50/day the queue never drains. Giving each commit its own group
  # removes the shared queue slot entirely — runs go wide instead of evicting
  # each other, which is the right way to spend runner minutes when the
  # alternative is an unverified production deploy.
  #
  # The stakes, from the last time this happened: #973 merged on 2026-08-17 and
  # its main run was CANCELLED by #967's and then #974's merging seconds later;
  # the migration drift and the unkeyed {#each} it carried went unreported, and
  # every branch cut from main failed `makemigrations --check` and `eslint` for
  # two days.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  # Superseding a PR push is the point of this — the older run tests code nobody
  # will merge. A merge_group run has the same stakes as main: cancel it and the
  # queue gets no verdict and stalls — so only PR runs are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Which areas changed (PR only) --------------------------------------
  # A cheap filter so a PR runs only the jobs its diff can break. The heavy
  # gates below `needs: [changes]` and switch on these outputs. Two rules keep
  # it SAFE (it may only ever over-run, never under-run a needed job):
  #   * A mixed PR trips several filters at once — each is an independent "did
  #     any matching file change" boolean — so it runs the union, never a subset.
  #   * The filter runs on pull_request ONLY. On push/main and merge_group the
  #     step is skipped, the outputs are empty, and every job's `if` falls back
  #     to its `github.event_name != 'pull_request'` clause and runs — the full
  #     gate, because those events ship to production.
  # `backend` deliberately EXCLUDES the content fixtures: a fixture-only change
  # cannot break "the image builds and serves /api/health/" (fixture INTEGRITY
  # is covered by backend-tests, which content triggers), so it must not drag in
  # the Docker build. A `.py` seed module (quote_seed, corrections, …) is code
  # and does trip `backend` — over-running the image build, which is the safe side.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter lists a PR's changed files through the GitHub API, which
    # needs pull-requests:read — this repo's default token doesn't grant it
    # ("Resource not accessible by integration"). Scoped to THIS job so the other
    # jobs keep their default token permissions (gha cache, artifact upload).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      content: ${{ steps.filter.outputs.content }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/library/fixtures/**'
            content:
              - 'backend/library/fixtures/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/workflows/**'
              - 'render.yaml'

  # --- Backend gate -------------------------------------------------------
  backend-tests:
    name: Backend — lint, migrations, tests
    needs: [changes]
    # Backend code OR content (fixture integrity tests). Skips a frontend-only PR.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.content == 'true' }}
    runs-on: ubuntu-latest
    # The ceiling exists only to reap a hang, not to cut a slow-but-real run.
    # The suite grows with the library: by 2026-09-26 it ran 2,012 tests in
    # ~24.5 min (1,456-1,465 s) on its own, so the old 25-minute ceiling was
    # cancelling runs seconds after the last test finished (#3966, #3989,
    # #4012, #4013). 40 leaves room to grow and still reaps a real hang.
    timeout-minutes: 40
    env:
      DJANGO_DEBUG: 'true'
    # The suite runs ONCE, on Postgres — the production database. Postgres is a
    # strict superset of the old SQLite pass: it runs every test PLUS the ~19
    # @skipUnless(connection.vendor == "postgresql") tests (stored tsvectors,
    # the GIN migration, websearch queries, RLS, row locking) that SQLite skips,
    # and there are no SQLite-only tests for it to miss. The separate SQLite pass
    # was ~1,400 tests re-run for zero production coverage; dropping it halves
    # this job, the workflow's long pole. (Local dev still runs on SQLite, so a
    # SQLite-only regression surfaces there — production is what CI must gate.)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Check for missing migrations
        working-directory: backend
        run: uv run python manage.py makemigrations --check --dry-run

      # --parallel auto: one worker per core (4 on ubuntu-latest), each with its
      # own cloned test DB. This suite is the workflow's long pole — ~19m serial
      # — and it is the whole reason the four-job split did not move the needle
      # further. It is safe to parallelize: no test pins an integer pk; every
      # file write goes to a per-process tempfile; the only shared-path write
      # (build_curated_covers' .cache) is confined to one test under a fixed
      # key, and a given test method only ever runs on one worker; the
      # TransactionTestCase concurrency tests get their own worker DB. If a race
      # ever does surface, it fails HERE by name — not in production.
      - name: Tests (Postgres — the production database)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run python manage.py test --parallel auto --verbosity 1

  # --- Production image gate (runs in parallel with everything) ------------
  backend-image:
    name: Backend — production image builds, runs unprivileged, and serves
    needs: [changes]
    # Backend CODE only. A content-only or frontend-only PR cannot change whether
    # the image builds and serves, so it skips this (the biggest single saving).
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own throwaway Postgres — it boots the real image with the real CMD
    # (gunicorn, as `app`) against a live DB and requires a healthy response.
    # A build alone would not catch the failure that actually matters — the
    # image not SERVING — so this both builds AND boots it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache in GitHub Actions storage, keyed by build context. The base
      # image + `uv sync` layer rarely change, so most builds reuse them and the
      # cold `docker build` (previously every run) becomes near-instant.
      - name: Build production image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true            # load into the local docker so we can run it
          push: false
          tags: ochorus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs unprivileged and serves
        run: |
          user="$(docker run --rm ochorus-api:ci id -un)"
          echo "image runs as: $user"
          test "$user" = "app"
          docker run -d --name api-image-smoke --network host \
            -e PORT=8000 \
            -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=ci-image-smoke-not-a-real-secret \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            ochorus-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health/ \
            || { echo "::error::the production image did not serve"; docker logs api-image-smoke; exit 1; }

      - name: Stop image smoke container
        if: always()
        run: docker rm -f api-image-smoke 2>/dev/null || true

  # --- Frontend static gate (no API needed; runs in parallel) --------------
  frontend-checks:
    name: Frontend — lint, type-check, unit tests
    needs: [changes]
    # Frontend source only — eslint/svelte-check/unit tests read nothing from the
    # backend, so a backend- or content-only PR skips this.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # frontend/.nvmrc, not a literal here: a developer's nvm/fnm reads that
          # file and CI reads this line, so two literals drift silently and the
          # only symptom is local-only failures nobody can reproduce in CI.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        working-directory: frontend
        run: npm ci

      - name: Compile i18n messages
        working-directory: frontend
        # Paraglide output ($lib/paraglide) is gitignored (generated), so it must
        # be compiled before svelte-check, which would otherwise fail on the
        # $lib/paraglide/* imports.
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Lint (eslint)
        working-directory: frontend
        run: npx eslint .

      - name: Type-check
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm run test

  # --- Integration: build against a live API + real-browser smoke ----------
  # This is the long pole. The frontend build prerenders pages by fetching the
  # API, so this job brings a seeded API up locally (mirrors the real Render web
  # build against the API), builds, asserts the built output, then runs the
  # only gate that RUNS the app.
  integration:
    name: Frontend build, prerender guards, browser smoke (real API)
    needs: [changes]
    # The prerender fetches the live API, so BOTH backend code and content can
    # change the built output — this runs on any code/content change and skips
    # only a docs-only PR. It is the long pole, so skipping it is the second-
    # biggest saving, but only where nothing it renders could have moved.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.content == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_DEBUG: 'true' # local SQLite for the prerender API — no Postgres needed
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — seed + start API for prerender
        working-directory: backend
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_if_empty
          # Release-chain steps, because two page types exist only after them
          # and the built-output guards below are blind to a page that was
          # never built. `index_citations` is what gives /scripture its pages;
          # `seed_quotes` is what gives /quotes/<author> its cards.
          uv run python manage.py index_citations
          uv run python manage.py seed_quotes
          uv run python manage.py runserver 8000 --noreload &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install (locked)
        working-directory: frontend
        run: npm ci

      - name: Frontend — compile i18n messages
        working-directory: frontend
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Frontend — build
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

      # These guards assert on BUILT html, so they run after the build.
      # prerenderCoverage catches a page the sitemap advertises and the build
      # never produced: the static adapter serves the noindex 200.html shell for
      # those, so they are promised to Google and then refused.
      - name: Frontend — built-output guards
        working-directory: frontend
        run: npx vitest run src/lib/href.test.ts src/lib/prerenderCoverage.test.ts

      # The browser download is the single most expensive thing in this workflow.
      # Keyed on the lockfile, so a Playwright version bump re-downloads.
      # restore-keys lets a near-miss reuse the previous browser directory —
      # `playwright install` then fetches only what is actually missing.
      - name: Frontend — cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # No `--with-deps`, deliberately: ubuntu-latest ships Google Chrome, so
      # Chromium's shared libraries are already on the image, and the smoke test
      # below launches the real browser — so a missing library fails THIS gate
      # loudly. If a runner-image update ever removes those libs, the fix is
      # restoring --with-deps on this line, not debugging the smoke test.
      - name: Frontend — install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium

      # The only gate that RUNS the app. Everything else is blind to hydration,
      # client-side routing and live API fetches. Serves the build just produced
      # and reuses the API already up.
      - name: Frontend — smoke tests (real browser, real API)
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Upload smoke-test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Stop the background API before the job's post-steps run — a lingering
      # `uv run … runserver` process makes setup-uv's cache-prune fail (exit 2).
      - name: Stop local API
        if: always()
        run: pkill -f "manage.py runserver" 2>/dev/null || true

  # --- Stable required-check name -----------------------------------------
  # Branch protection requires the context "test-and-build". Splitting the old
  # monolith renamed that job away, so this aggregator RE-EMITS the name and
  # goes green only when all four real jobs pass. This keeps the required check
  # stable WITHOUT a branch-protection edit — which matters because every other
  # session's open PR still runs the old single-job ci.yml, and switching the
  # required contexts to the four new names would block all of them behind
  # "expected" checks they never produce until each is rebased. `main` moves
  # fast here with many parallel sessions; that is not an acceptable stall.
  #
  # `if: always()` + explicit result checks so a FAILED upstream job makes this
  # FAIL (report red), not skip — a skipped required check blocks merge just as
  # hard as a pending one. If you add or rename a real job above, add it both to
  # `needs` and to the test below.
  #
  # A path-filtered job reports `skipped`, which is a PASS here — the change
  # couldn't break it, so there was nothing to run. Only `failure`/`cancelled`
  # (or a `changes` job that didn't succeed) fails the gate. This is what lets
  # the sub-jobs skip while `test-and-build` — the one required context in branch
  # protection — still runs on every PR and gives the true verdict.
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, backend-tests, backend-image, frontend-checks, integration]
    steps:
      - name: Every gate passed or was skipped
        run: |
          echo "changes:         ${{ needs.changes.result }}"
          echo "backend-tests:   ${{ needs.backend-tests.result }}"
          echo "backend-image:   ${{ needs.backend-image.result }}"
          echo "frontend-checks: ${{ needs.frontend-checks.result }}"
          echo "integration:     ${{ needs.integration.result }}"
          # The filter itself must have run; a broken filter must not merge blind.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::the changes filter did not succeed"; exit 1
          fi
          fail=
          for entry in \
            "backend-tests:${{ needs.backend-tests.result }}" \
            "backend-image:${{ needs.backend-image.result }}" \
            "frontend-checks:${{ needs.frontend-checks.result }}" \
            "integration:${{ needs.integration.result }}"; do
            name="${entry%%:*}"; result="${entry##*:}"
            case "$result" in
              success|skipped) : ;;  # skipped == path filter said this change can't break it
              *) echo "::error::$name did not pass (result: $result)"; fail=1 ;;
            esac
          done
          [ -z "$fail" ] || exit 1
