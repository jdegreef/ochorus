name: CI

# Quality gate for every PR and push to main. Blocks a merge until the backend
# tests + migration check pass, the production image builds & serves, the
# frontend type-checks/builds, and the browser smoke passes. Add EVERY job in
# this workflow as a required status check in branch protection so they gate
# merges (autoDeploy ships main to production).
#
# Structure: four jobs that run in PARALLEL instead of one serial job.
#   backend-tests   — ruff, migration check, SQLite + Postgres suites
#   backend-image   — production Docker image builds (layer-cached), runs
#                     unprivileged, and serves
#   frontend-checks — eslint, svelte-check, unit tests (no API needed)
#   integration     — seed a local API, build the frontend against it, assert
#                     the built output, run the real-browser smoke
# The first three are independent. `integration` is the long pole and also
# independent, so it starts at t=0 alongside the rest. Nothing `needs:` anything.
#
# `merge_group` runs this same gate on the merge queue's temporary branch — the PR
# merged onto the CURRENT main (and any PRs ahead of it in the queue). That is what
# finally closes the divergent-migration-leaf race (the 0121->0125 cascade of
# 2026-09-06): a PR whose migration was cut off a now-stale leaf produces two leaf
# nodes on the real merge, so `makemigrations --check` fails HERE and the queue
# ejects it — instead of breaking main and the deploy after it lands. Requires
# "Require merge queue" on the main branch-protection rule to actually take effect.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is the point of this — the older run tests code nobody
  # will merge. On MAIN it is the opposite: cancelling means the merge that was
  # just pushed gets no verdict at all, and main auto-deploys to production.
  # That is not hypothetical. #973 merged on 2026-08-17 and its main run was
  # CANCELLED by #967's and then #974's merging seconds later; the migration
  # drift and the unkeyed {#each} it carried went unreported, and every branch
  # cut from main failed `makemigrations --check` and `eslint` for two days. A
  # merge_group run has the same stakes as main: cancel it and the queue gets no
  # verdict and stalls — so only PR runs are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Backend gate -------------------------------------------------------
  backend-tests:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest
    # Observed legitimate maximum for the backend suite is well under this; the
    # ceiling exists only to reap a hang, not to cut a slow-but-real run.
    timeout-minutes: 25
    env:
      DJANGO_DEBUG: 'true' # local SQLite, no external services
    # Throwaway Postgres so the production search path (stored tsvectors,
    # GIN migration, websearch queries) actually runs in CI — the SQLite
    # test run skips every @skipUnless(vendor == "postgresql") test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Check for missing migrations
        working-directory: backend
        run: uv run python manage.py makemigrations --check --dry-run

      # --parallel auto: one worker per core (4 on ubuntu-latest), each with its
      # own cloned test DB. This suite is the workflow's long pole — ~19m serial
      # — and it is the whole reason the four-job split did not move the needle
      # further. It is safe to parallelize: no test pins an integer pk; every
      # file write goes to a per-process tempfile; the only shared-path write
      # (build_curated_covers' .cache) is confined to one test under a fixed
      # key, and a given test method only ever runs on one worker; the
      # TransactionTestCase concurrency tests get their own worker DB. If a race
      # ever does surface, it fails HERE by name — not in production.
      - name: Tests
        working-directory: backend
        run: uv run python manage.py test --parallel auto --verbosity 1

      - name: Tests (Postgres, the production search path)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run python manage.py test --parallel auto --verbosity 1

  # --- Production image gate (runs in parallel with everything) ------------
  backend-image:
    name: Backend — production image builds, runs unprivileged, and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own throwaway Postgres — it boots the real image with the real CMD
    # (gunicorn, as `app`) against a live DB and requires a healthy response.
    # A build alone would not catch the failure that actually matters — the
    # image not SERVING — so this both builds AND boots it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Layer cache in GitHub Actions storage, keyed by build context. The base
      # image + `uv sync` layer rarely change, so most builds reuse them and the
      # cold `docker build` (previously every run) becomes near-instant.
      - name: Build production image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true            # load into the local docker so we can run it
          push: false
          tags: ochorus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs unprivileged and serves
        run: |
          user="$(docker run --rm ochorus-api:ci id -un)"
          echo "image runs as: $user"
          test "$user" = "app"
          docker run -d --name api-image-smoke --network host \
            -e PORT=8000 \
            -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=ci-image-smoke-not-a-real-secret \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            ochorus-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health/ \
            || { echo "::error::the production image did not serve"; docker logs api-image-smoke; exit 1; }

      - name: Stop image smoke container
        if: always()
        run: docker rm -f api-image-smoke 2>/dev/null || true

  # --- Frontend static gate (no API needed; runs in parallel) --------------
  frontend-checks:
    name: Frontend — lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # frontend/.nvmrc, not a literal here: a developer's nvm/fnm reads that
          # file and CI reads this line, so two literals drift silently and the
          # only symptom is local-only failures nobody can reproduce in CI.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        working-directory: frontend
        run: npm ci

      - name: Compile i18n messages
        working-directory: frontend
        # Paraglide output ($lib/paraglide) is gitignored (generated), so it must
        # be compiled before svelte-check, which would otherwise fail on the
        # $lib/paraglide/* imports.
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Lint (eslint)
        working-directory: frontend
        run: npx eslint .

      - name: Type-check
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm run test

  # --- Integration: build against a live API + real-browser smoke ----------
  # This is the long pole. The frontend build prerenders pages by fetching the
  # API, so this job brings a seeded API up locally (mirrors the real Render web
  # build against the API), builds, asserts the built output, then runs the
  # only gate that RUNS the app.
  integration:
    name: Frontend build, prerender guards, browser smoke (real API)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_DEBUG: 'true' # local SQLite for the prerender API — no Postgres needed
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Backend — install (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — seed + start API for prerender
        working-directory: backend
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_if_empty
          # Release-chain steps, because two page types exist only after them
          # and the built-output guards below are blind to a page that was
          # never built. `index_citations` is what gives /scripture its pages;
          # `seed_quotes` is what gives /quotes/<author> its cards.
          uv run python manage.py index_citations
          uv run python manage.py seed_quotes
          uv run python manage.py runserver 8000 --noreload &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install (locked)
        working-directory: frontend
        run: npm ci

      - name: Frontend — compile i18n messages
        working-directory: frontend
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Frontend — build
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

      # These guards assert on BUILT html, so they run after the build.
      # prerenderCoverage catches a page the sitemap advertises and the build
      # never produced: the static adapter serves the noindex 200.html shell for
      # those, so they are promised to Google and then refused.
      - name: Frontend — built-output guards
        working-directory: frontend
        run: npx vitest run src/lib/href.test.ts src/lib/prerenderCoverage.test.ts

      # The browser download is the single most expensive thing in this workflow.
      # Keyed on the lockfile, so a Playwright version bump re-downloads.
      # restore-keys lets a near-miss reuse the previous browser directory —
      # `playwright install` then fetches only what is actually missing.
      - name: Frontend — cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # No `--with-deps`, deliberately: ubuntu-latest ships Google Chrome, so
      # Chromium's shared libraries are already on the image, and the smoke test
      # below launches the real browser — so a missing library fails THIS gate
      # loudly. If a runner-image update ever removes those libs, the fix is
      # restoring --with-deps on this line, not debugging the smoke test.
      - name: Frontend — install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium

      # The only gate that RUNS the app. Everything else is blind to hydration,
      # client-side routing and live API fetches. Serves the build just produced
      # and reuses the API already up.
      - name: Frontend — smoke tests (real browser, real API)
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Upload smoke-test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Stop the background API before the job's post-steps run — a lingering
      # `uv run … runserver` process makes setup-uv's cache-prune fail (exit 2).
      - name: Stop local API
        if: always()
        run: pkill -f "manage.py runserver" 2>/dev/null || true

  # --- Stable required-check name -----------------------------------------
  # Branch protection requires the context "test-and-build". Splitting the old
  # monolith renamed that job away, so this aggregator RE-EMITS the name and
  # goes green only when all four real jobs pass. This keeps the required check
  # stable WITHOUT a branch-protection edit — which matters because every other
  # session's open PR still runs the old single-job ci.yml, and switching the
  # required contexts to the four new names would block all of them behind
  # "expected" checks they never produce until each is rebased. `main` moves
  # fast here with many parallel sessions; that is not an acceptable stall.
  #
  # `if: always()` + explicit result checks so a FAILED upstream job makes this
  # FAIL (report red), not skip — a skipped required check blocks merge just as
  # hard as a pending one. If you add or rename a real job above, add it both to
  # `needs` and to the test below.
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [backend-tests, backend-image, frontend-checks, integration]
    steps:
      - name: Every gate passed
        run: |
          echo "backend-tests:   ${{ needs.backend-tests.result }}"
          echo "backend-image:   ${{ needs.backend-image.result }}"
          echo "frontend-checks: ${{ needs.frontend-checks.result }}"
          echo "integration:     ${{ needs.integration.result }}"
          [ "${{ needs.backend-tests.result }}" = "success" ] \
            && [ "${{ needs.backend-image.result }}" = "success" ] \
            && [ "${{ needs.frontend-checks.result }}" = "success" ] \
            && [ "${{ needs.integration.result }}" = "success" ] \
            || { echo "::error::a required CI job did not succeed"; exit 1; }
