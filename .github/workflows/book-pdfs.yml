name: Book PDFs

# Builds the PDF of every edition in export_policy.STORED_PDF_EDITIONS and
# uploads it to the public Supabase Storage bucket `book-pdfs`, overwriting in
# place — so a book's pdf_url never changes, and git never holds the files.
#
#   * push to main: rebuilds only the editions whose fixture changed; a change
#     to the print pipeline, the back matter, the covers or an author bio
#     rebuilds them all.
#   * Run workflow (Actions tab): rebuilds them all.
#
# The text comes from the seeded FIXTURE, like CI's API. A fix that reached
# production only by data migration isn't in a PDF until the fixture has it.
#
# Credentials are Supabase Storage S3 keys (Project Settings → Storage → S3
# access keys), which reach Storage only — never the service-role key, which
# can do anything to the database:
#   secrets.SUPABASE_S3_ACCESS_KEY_ID, secrets.SUPABASE_S3_SECRET_ACCESS_KEY
#   vars.SUPABASE_S3_REGION   (the region shown on that same settings page)

on:
  push:
    branches: [main]
    paths:
      - 'backend/library/fixtures/content/books/*.json'
      - 'backend/library/fixtures/content/authors.json'
      - 'backend/library/book_export.py'
      - 'backend/library/export_policy.py'
      - 'backend/library/export_strings.json'
      - 'backend/library/export_imprints.json'
      - 'backend/library/export_bios/**'
      - 'backend/library/export_covers/**'
      - 'backend/library/print_fonts/**'
      - 'backend/library/management/commands/export_book.py'
      - '.github/workflows/book-pdfs.yml'
  workflow_dispatch:

# One upload at a time, and never cancel one halfway: a later run rebuilds
# what it needs on its own.
concurrency:
  group: book-pdfs
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read # paths-filter lists the push's files through the API

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # A full rebuild took 22 minutes for 462 editions; the Bible's 66 add several.
    timeout-minutes: 50
    env:
      DJANGO_DEBUG: 'true' # local SQLite, seeded from the fixture
      PUBLIC_SITE_URL: https://ochorus.com # colophon links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changed
        if: github.event_name == 'push'
        with:
          list-files: shell
          filters: |
            pipeline:
              - 'backend/library/fixtures/content/authors.json'
              - 'backend/library/book_export.py'
              - 'backend/library/export_policy.py'
              - 'backend/library/export_strings.json'
              - 'backend/library/export_imprints.json'
              - 'backend/library/export_bios/**'
              - 'backend/library/export_covers/**'
              - 'backend/library/print_fonts/**'
              - 'backend/library/management/commands/export_book.py'
              - '.github/workflows/book-pdfs.yml'
            books:
              - 'backend/library/fixtures/content/books/*.json'

      # "" = every stored edition; otherwise slug:en for each changed fixture.
      # export_book skips any that aren't in STORED_PDF_EDITIONS.
      - name: Which editions
        id: which
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ steps.changed.outputs.pipeline }}" = "true" ]; then
            echo "editions=" >> "$GITHUB_OUTPUT"
          else
            list=""
            for f in ${{ steps.changed.outputs.books_files }}; do
              b=$(basename "$f" .json)          # <slug>.<lang>
              list="$list${list:+,}${b%.*}:${b##*.}"
            done
            echo "editions=$list" >> "$GITHUB_OUTPUT"
          fi

      # Arabic, Devanagari, Ethiopic, Hangul and kana/kanji have no glyphs in EB Garamond;
      # the print CSS falls back to the system's fonts, and the runner has none
      # for them. fonts-noto-core carries Arabic, Devanagari and Ethiopic;
      # Korean and Japanese (Noto Serif CJK KR / JP) are only in fonts-noto-cjk.
      - name: Fonts for Arabic, Hindi, Amharic, Korean and Japanese editions
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk >/dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build PDFs
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_if_empty
          uv run python manage.py export_book --all --format pdf \
            --editions "${{ steps.which.outputs.editions }}" --out "$RUNNER_TEMP/pdfs"

      # ubuntu-latest ships the AWS CLI. Newer versions send checksums some
      # S3-compatible stores reject, so only send them when required.
      # Runs after a failed build too: export_book only ever leaves finished,
      # checked PDFs in the folder, so a bio too long for its page (which
      # fails the build) never holds back every other book's update.
      - name: Upload to Supabase Storage
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SUPABASE_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          n=$(find "$RUNNER_TEMP/pdfs" -name '*.pdf' | wc -l)
          if [ "$n" -eq 0 ]; then echo "Nothing to upload."; exit 0; fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_DEFAULT_REGION" ]; then
            echo "::error::Supabase S3 credentials are not configured — see the header of this workflow."
            exit 1
          fi
          aws s3 cp "$RUNNER_TEMP/pdfs/" "s3://book-pdfs/" --recursive \
            --endpoint-url "https://eywunobxqijvwymdzlwy.supabase.co/storage/v1/s3" \
            --content-type application/pdf \
            --cache-control "public, max-age=3600"
          echo "Uploaded $n PDFs."
