name: TEMP fetch source pages (institutes)

# Throwaway: the session drafting this book cannot reach ccel.org. This runs
# the real import_ccel once on a runner, records every page it fetched under
# .source-cache/, and commits that back so the session can replay the import.
# Removed, with the cache, before the PR is reviewed.

on:
  push:
    branches: [claude/ochorus-dev-4c45eff4-calvin-institutes]
    paths: [.github/workflows/temp-fetch-sources.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install (frozen)
        working-directory: backend
        run: uv sync --frozen
      - name: Import from CCEL, recording every fetched page
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
        run: |
          uv run python manage.py migrate -v0
          uv run python - <<'PY'
          import os, pathlib, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from urllib.parse import urlparse
          from django.core.management import call_command
          from library.management.commands import import_ccel
          cache = pathlib.Path("../.source-cache")
          real = import_ccel.fetch
          def recording_fetch(url):
              html = real(url)
              u = urlparse(url)
              path = cache / u.netloc / u.path.lstrip("/")
              if not path.suffix:
                  path = path / "index.html"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(html, encoding="utf-8")
              return html
          import_ccel.fetch = recording_fetch
          call_command("import_ccel", "institutes-of-the-christian-religion")
          PY
      - name: Commit the cache back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .source-cache
          git commit -m "TEMP: CCEL pages for institutes" || echo "nothing fetched"
          git push
