name: TEMP fetch source pages (old-paths)

# Throwaway: the session drafting this book cannot reach ccel.org, gutenberg.org
# or archive.org. This downloads each URL in .source-cache/urls.txt on a runner
# and commits the responses back under .source-cache/<host>/<path>, so the
# session can run the repo's importers locally against them. Removed, with the
# cache, before the PR is reviewed.

on:
  push:
    branches: [claude/ochorus-dev-4c45eff4-old-paths]
    paths: [.source-cache/urls.txt, .source-cache/ocr.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download every listed URL
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          from urllib.parse import urlparse
          root = pathlib.Path(".source-cache")
          ua = "OchorusBot/0.1 (+https://ochorus.org; public-domain book reader)"
          for url in root.joinpath("urls.txt").read_text().split():
              u = urlparse(url)
              path = root / u.netloc / u.path.lstrip("/")
              if not path.suffix:
                  path = path / "index.html"
              if u.query:
                  import hashlib
                  path = path.with_name(path.name + "." + hashlib.sha1(u.query.encode()).hexdigest()[:10] + ".html")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      body = resp.read()
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(body)
                  print("ok  ", len(body), url)
              except Exception as exc:
                  print("FAIL", url, exc)
          PY

      - name: Install Tesseract
        if: hashFiles('.source-cache/ocr.txt') != ''
        timeout-minutes: 10
        run: sudo apt-get -qq update && sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y tesseract-ocr poppler-utils > /dev/null

      - name: Download the scan's PDF
        if: hashFiles('.source-cache/ocr.txt') != ''
        timeout-minutes: 15
        run: |
          id=$(head -1 .source-cache/ocr.txt); mkdir -p /tmp/ocr
          curl -sS --max-time 800 -L -A "OchorusBot/0.1" -o /tmp/ocr/book.pdf "https://archive.org/download/$id/$id.pdf"
          ls -la /tmp/ocr/book.pdf

      - name: Render pages
        if: hashFiles('.source-cache/ocr.txt') != ''
        timeout-minutes: 20
        run: cd /tmp/ocr && pdftoppm -r 300 -gray -png book.pdf pg && ls pg-*.png | wc -l && file $(ls pg-*.png | sed -n 31p)

      - name: Tesseract every page
        if: hashFiles('.source-cache/ocr.txt') != ''
        timeout-minutes: 50
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          id=$(head -1 .source-cache/ocr.txt); out="$GITHUB_WORKSPACE/.source-cache/tesseract/$id"; mkdir -p "$out"
          cd /tmp/ocr
          time tesseract $(ls pg-*.png | sed -n 31p) - -l eng quiet | head -5
          ls pg-*.png | xargs -P 4 -I{} sh -c 'timeout 300 tesseract {} "$(basename {} .png)" -l eng quiet; echo {}'
          cp pg-*.txt "$out/"; ls "$out" | wc -l
          cd "$GITHUB_WORKSPACE" && rm .source-cache/ocr.txt

      - name: Commit the downloads back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .source-cache
          git commit -m "TEMP: downloaded source pages" || echo "nothing downloaded"
          git push
