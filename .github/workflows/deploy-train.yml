name: Deploy train

# Deploys main to Render in batches instead of on every merge. Render's
# auto-deploy is off on ochorus-api and ochorus-web (render.yaml), so this
# workflow is the only thing that ships them: three times a day it moves both
# to the newest commit whose `test-and-build` passed, if anything
# deployable changed since the last deploy.
# Three, not every two hours (2026-11-20): each train runs the 20-70 minute
# web prerender on Render's build pipeline, which is billed by the minute, and
# at 50+ merges a day nearly every two-hourly train fired. Runs at 15:05,
# 21:05 and 03:05 UTC: 7 AM, 1 PM and 7 PM Pacific in winter (PST), an hour
# later in summer (PDT; cron is UTC and doesn't follow DST). A run that finds
# a deploy still going skips, so the next chance is six hours later; run it
# by hand (below) when something can't wait.
# It never overlaps a deploy: if ochorus-api or ochorus-web still has one
# running (the web build takes 20-70 min after the train exits), the run
# deploys nothing and stays green; the next run picks the work up. If Render
# cannot be asked, it deploys nothing and goes red.
# Every run also checks the web site it shipped last time: it goes RED if the
# last finished ochorus-web deploy failed or the live site lags main's newest
# green deployable commit by more than MAX_WEB_LAG_HOURS, and still deploys.
# (Nov 16–19, 2026: the web sat on an old commit for ~2 days behind green runs,
# because a run went green as soon as it had STARTED the web build.)
# .github/scripts/deploy_train.py has the rules and the why.
#
# A RED RUN MEANS PRODUCTION IS FROZEN OR BROKEN; the first line of the run
# summary says which. Fix it the same day. (Oct 5–8, 2026: the hook secrets
# were missing and main went undeployed.)
#
# Need it live now? Actions → Deploy train → Run workflow (tick "force" to
# redeploy even when nothing deployable changed), or:
#   gh workflow run deploy-train.yml
#
# Setup: a Render API key (Account Settings → API Keys) in the repo secret
# RENDER_API_KEY. The service IDs below are not secrets. Deploy hooks are not
# used: Render 500s on a hook carrying `ref=<sha>` (deploy_train.py has why).
# The email cron is not on the train; while email sending is off it is
# suspended and does not deploy at all (render.yaml).
on:
  schedule:
    - cron: '5 3,15,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy the newest green commit even if nothing deployable changed (never over a running deploy)'
        type: boolean
        default: false

concurrency:
  group: deploy-train
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  deployments: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Long enough to wait out the API deploy before starting the web one
    # (deploy_train.py API_WAIT_SECONDS is 40 minutes), plus the few minutes
    # of retries checking Render for a running deploy first.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history (the train walks commits since the last deploy), but
          # no file contents until a step asks for one: the scripts read only
          # commit graphs, file NAMES and render.yaml. A plain fetch-depth: 0
          # downloaded every version of every cover and fixture; the last 50
          # commits alone were a 646 MB pack (2026-11-21).
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Deploy if anything deployable changed
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_API: srv-d948c44vikkc73brci60 # ochorus-api
          RENDER_SERVICE_ID_WEB: srv-d948c44vikkc73brci5g # ochorus-web
          # Red when a deployable commit has waited longer than this on main.
          MAX_WEB_LAG_HOURS: '6'
        run: |
          pip install --quiet pyyaml
          python3 .github/scripts/deploy_train.py
