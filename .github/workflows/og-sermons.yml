name: Generate sermon og twins

# One-shot helper: the og:image generator (frontend/scripts/og-card.mjs) reads
# Linux-only Liberation fonts from /usr/share/fonts, so the twins can't be made
# on a dev machine without them. Run this on the Ubuntu runner (which has the
# fonts) to generate and commit the twins to the current branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  og-sermons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Liberation fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Generate og:sermons twins
        working-directory: frontend
        run: npm run og:sermons
      - name: Commit twins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/static/og/sermons/
          if git diff --cached --quiet; then
            echo "No twin changes to commit."
          else
            git commit -m "Generate sermon og:image twins (Linux Liberation fonts)"
            git push
          fi
