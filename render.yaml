      # Ochorus Originals is the house imprint, not a person: its books moved
      # from an author page to their own shelf. Localized /<lang>/authors/
      # ochorus-originals/ URLs are redirected by the page's own load.
      - type: redirect
        source: /authors/ochorus-originals
        destination: /originals/
      - type: redirect
        source: /authors/ochorus-originals/
        destination: /originals/
      # NO no-slash -> slash 301 here, deliberately. Render's route matcher is
      # trailing-slash-INSENSITIVE: a rule with `source: /about` also serves
      # `/about/` (verified live — there is no build/about/ directory, only
      # about.html). So `source: /books/:slug` would match `/books/<slug>/` too,
      # and for a path with NO prerendered file it would 301 the slashed URL to
      # itself — an infinite redirect loop. The 301 would have to live at an
      # edge we control (a Cloudflare zone for ochorus.com, which doesn't exist
      # today — docs/seo-edge-rules.md), so for now a no-slash detail URL gets
      # the 404 shell below, whose JavaScript still forwards a reader to the
      # slash form ($lib/canonicalRedirect). Crawlers see the 404; every link we
      # emit is slashed, so only old external backlinks lose the redirect.
      #
      # NO catch-all. A path with no prerendered file and no rule above gets
      # Render's /404.html — the same SPA shell as 200.html (postbuild copies
      # it; scripts/build-404.mjs), so a reader still gets the app's not-found
      # page, but crawlers get an honest 404 STATUS. The old `/* -> /200.html`
      # answered 200 for every typo'd slug, dead WordPress URL, out-of-range
      # chapter and untranslated `/es/books/<en-only>/` — soft 404s that Google
      # kept re-crawling instead of the real pages.
      #
      # Only the client-only app routes (prerender = false: admin, settings,
      # notebook, the reader…) still get the 200 shell, in every locale (the
      # `:lang` rules below). /login and /reset-password keep the
      # shell they always got (Render doesn't map /login to login.html). The
      # list lives in frontend/src/lib/shellRoutes.ts; shellRoutes.test.ts keeps
      # this block, that list and the route tree in step.
      #
      # These come FIRST: the `:lang` index rules further down would otherwise
      # catch the app's own two-segment routes (/admin/books, /admin/sermons,
      # /admin/search) and rewrite them to a .html that does not exist.
      - type: rewrite
        source: /admin
        destination: /200.html
      - type: rewrite
        source: /admin/*
        destination: /200.html
      - type: rewrite
        source: /settings
        destination: /200.html
      - type: rewrite
        source: /favorites
        destination: /200.html
      - type: rewrite
        source: /notebook
        destination: /200.html
      - type: rewrite
        source: /notebook/*
        destination: /200.html
      - type: rewrite
        source: /reading
        destination: /200.html
      - type: rewrite
        source: /welcome
        destination: /200.html
      - type: rewrite
        source: /login
        destination: /200.html
      - type: rewrite
        source: /reset-password
        destination: /200.html
      - type: rewrite
        source: /email/preferences/*
        destination: /200.html
      # Every other UI locale: ONE `:lang` placeholder rule per route, never a
      # copy per locale. The copies took this service to 255 rules and Render
      # stopped applying them: every Blueprint sync from #4512 on failed on
      # "Update web service ochorus-web routes" (166 rules synced, 204 did not;
      # Render documents no limit). Keep the total well under 166.
      - type: rewrite
        source: /:lang/admin
        destination: /200.html
      - type: rewrite
        source: /:lang/admin/*
        destination: /200.html
      - type: rewrite
        source: /:lang/settings
        destination: /200.html
      - type: rewrite
        source: /:lang/favorites
        destination: /200.html
      - type: rewrite
        source: /:lang/notebook
        destination: /200.html
      - type: rewrite
        source: /:lang/notebook/*
        destination: /200.html
      - type: rewrite
        source: /:lang/reading
        destination: /200.html
      - type: rewrite
        source: /:lang/welcome
        destination: /200.html
      - type: rewrite
        source: /:lang/login
        destination: /200.html
      - type: rewrite
        source: /:lang/reset-password
        destination: /200.html
      - type: rewrite
        source: /:lang/email/preferences/*
        destination: /200.html
      # INDEX pages: Render doesn't auto-map extensionless URLs to their .html
      # files, so map each one here.
      #
      # DETAIL pages (/books|authors|sermons|plans|topics /:slug) are NOT
      # rewritten. They prerender to <slug>/index.html, which Render serves for
      # the TRAILING-SLASH URL only (the no-slash form is not resolved to it —
      # production served a 3,953 b shell for it). A MISSING slug matches no
      # rule and gets /404.html, which renders the designed not-found page with
      # a real 404 status (see the end of this list). A :slug -> :slug.html
      # rewrite instead served a blank empty-200 for a missing slug — deploy
      # skill, gotcha #8.
      - type: rewrite
        source: /books
        destination: /books.html
      - type: rewrite
        source: /biographies
        destination: /biographies.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /legal
        destination: /legal.html
      - type: rewrite
        source: /sermons
        destination: /sermons.html
      - type: rewrite
        source: /plans
        destination: /plans.html
      # /search prerenders to an empty-state shell (see search/+page.ts). Without
      # this rewrite the built search.html is unreachable: /search matches no
      # rule and falls to /* -> /200.html, so the page 200s with the 4 KB app
      # shell — exactly the crawler-invisible state prerendering it was meant to
      # fix. Shipped that way in #725; the prerender was right, the route was
      # missing.
      - type: rewrite
        source: /search
        destination: /search.html
      - type: rewrite
        source: /topics
        destination: /topics.html
      # Each UI locale's landing page.
      - type: rewrite
        source: /es
        destination: /es.html
      - type: rewrite
        source: /sw
        destination: /sw.html
      - type: rewrite
        source: /lg
        destination: /lg.html
      - type: rewrite
