      # NO no-slash -> slash 301 here, deliberately. Render's route matcher is
      # trailing-slash-INSENSITIVE: a rule with `source: /about` also serves
      # `/about/` (verified live — there is no build/about/ directory, only
      # about.html). So `source: /books/:slug` would match `/books/<slug>/` too,
      # and for a path with NO prerendered file it would 301 the slashed URL to
      # itself — an infinite redirect loop. Files beat rules, so real pages are
      # safe, but every untranslated book (`/es/books/<en-only-slug>/`), typo'd
      # slug and out-of-range chapter currently falls to the SPA not-found and
      # would instead have looped. Internal links, canonicals and the sitemap all
      # emit the slash form now, which is what actually fixes crawling; if the
      # already-indexed no-slash URLs need an explicit 301, it has to be done
      # where the no-slash form can be matched on its own — a Cloudflare rule
      # conditioned on "URI path does not end with /".
      # Everything else — detail pages (served natively as <slug>/index.html),
      # the reader, search, and any missing/unpublished slug — falls back to the
      # SPA app shell, which renders the real page or the not-found page.
      - type: rewrite
        source: /*
        destination: /200.html
    envVars:
      - key: PUBLIC_API_BASE_URL # the ochorus-api URL, after first deploy
        sync: false
      - key: PUBLIC_SITE_URL # public origin for canonical/OG/sitemap; the ochorus-web URL (or ochorus.com later)
        sync: false
      - key: PUBLIC_SUPABASE_URL # https://<project-ref>.supabase.co (enables login)
        sync: false
      - key: PUBLIC_SUPABASE_ANON_KEY # Supabase anon/publishable key (safe in the browser)
        sync: false
      # Optional: paste a Sentry DSN to turn on browser error monitoring. Reports
      # carry the build's commit, baked in at build time (see vite.config.ts).
      #
      # NOT YET WIRED: source maps. Without them a browser stack trace is one
      # minified line, so the release tells you WHICH build broke and not where.
      # Uploading them needs a Sentry auth token, org and project in the build
      # environment — credentials this file deliberately does not carry — plus
      # `build.sourcemap` on and the maps deleted after upload, since serving
      # them publishes the source.
      - key: PUBLIC_SENTRY_DSN
        sync: false
      # Optional: set to the site's Plausible property (its `data-domain`, e.g.
      # `ochorus.com`) to turn on cookieless pageview analytics. Unset = off, no
      # script loaded, no requests (see analytics.ts). The plausible.io host is
      # already in the CSP above; a self-hosted instance also needs a
      # PUBLIC_PLAUSIBLE_SRC var added (here or via the Render dashboard) and
      # that host swapped into the CSP. Cloud (the default) needs neither.
      - key: PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
      # How long the prebuild waits for ochorus-api to serve THIS commit's
      # content before prerendering (scripts/await-api-release.mjs). A content
      # commit deploys both services at once, and the static build reaches this
      # gate in ~1 min while the API's Docker build + migrate + seed can take
      # several minutes more — so the script's own 5-min default was timing out
      # and failing the web build even though the API was merely mid-deploy, not
      # broken. 15 min gives the API deploy comfortable headroom; waiting costs
      # only static-build minutes, whereas failing ships nothing.
      - key: API_RELEASE_TIMEOUT_MS
        value: "900000"
