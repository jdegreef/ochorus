        destination: /hi.html
      - type: rewrite
        source: /uk
        destination: /uk.html
      - type: rewrite
        source: /fr
        destination: /fr.html
      - type: rewrite
        source: /am
        destination: /am.html
      - type: rewrite
        source: /vi
        destination: /vi.html
      - type: rewrite
        source: /ko
        destination: /ko.html
      # Each UI locale's index pages: one `:lang` rule per page (Render
      # substitutes the placeholder into the destination). A `:lang` that is not
      # a locale (`/x/books`) rewrites to a .html that does not exist and gets a
      # blank 200 rather than the 404 shell — nothing links to such paths. Real
