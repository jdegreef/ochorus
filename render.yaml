# Render blueprint for Ochorus — deploys the API + reader from this repo.
# In Render: New → Blueprint → connect this GitHub repo. You'll be prompted to
# fill in the values marked `sync: false`. See DEPLOYMENT.md for the full walk-through.

services:
  # --- Django API (Docker web service) -------------------------------------
  - name: ochorus-api
    type: web
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # always-on; avoids cold-start spin-down
    healthCheckPath: /api/health/
    autoDeploy: true
    # Per deploy, before the new version goes live: apply migrations, then seed
    # the library from the committed fixture if (and only if) the DB is empty.
    # If this fails, Render keeps the current version up.
    preDeployCommand: "uv run python manage.py release"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates a strong secret
      - key: DATABASE_URL # Supabase session-pooler connection string
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: DJANGO_ALLOWED_HOSTS # the ochorus-api host, e.g. ochorus-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS # the ochorus-web URL, after first deploy
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # same frontend URL (used by the Django admin)
        sync: false
      - key: SENTRY_DSN # optional: paste a Sentry DSN to turn on API error monitoring
        sync: false

  # --- SvelteKit reader (static SPA) ---------------------------------------
  - name: ochorus-web
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    routes:
      # Serve the prerendered HTML for the public (crawlable) pages. Render
      # doesn't auto-map extensionless URLs to their .html files, so map them
      # here. Single-segment :slug matches a book/author but NOT the 3-segment
      # reader path, so the reader falls through to the SPA shell below.
      - type: rewrite
        source: /books
        destination: /books.html
      - type: rewrite
        source: /biographies
        destination: /biographies.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /books/:slug
        destination: /books/:slug.html
      - type: rewrite
        source: /authors/:slug
        destination: /authors/:slug.html
      - type: rewrite
        source: /sermons
        destination: /sermons.html
      - type: rewrite
        source: /sermons/:slug
        destination: /sermons/:slug.html
      - type: rewrite
        source: /plans
        destination: /plans.html
      - type: rewrite
        source: /plans/:slug
        destination: /plans/:slug.html
      # Localized (URL-prefixed) copies of the prerendered pages. Render has no
      # wildcard for the locale segment, so each locale repeats the block above.
      # Keep these before the SPA catch-all.
      - type: rewrite
        source: /es
        destination: /es.html
      - type: rewrite
        source: /es/books
        destination: /es/books.html
      - type: rewrite
        source: /es/biographies
        destination: /es/biographies.html
      - type: rewrite
        source: /es/about
        destination: /es/about.html
      - type: rewrite
        source: /es/contact
        destination: /es/contact.html
      - type: rewrite
        source: /es/books/:slug
        destination: /es/books/:slug.html
      - type: rewrite
        source: /es/authors/:slug
        destination: /es/authors/:slug.html
      - type: rewrite
        source: /es/sermons
        destination: /es/sermons.html
      - type: rewrite
        source: /es/sermons/:slug
        destination: /es/sermons/:slug.html
      - type: rewrite
        source: /es/plans
        destination: /es/plans.html
      - type: rewrite
        source: /es/plans/:slug
        destination: /es/plans/:slug.html
      - type: rewrite
        source: /sw
        destination: /sw.html
      - type: rewrite
        source: /sw/books
        destination: /sw/books.html
      - type: rewrite
        source: /sw/biographies
        destination: /sw/biographies.html
      - type: rewrite
        source: /sw/about
        destination: /sw/about.html
      - type: rewrite
        source: /sw/contact
        destination: /sw/contact.html
      - type: rewrite
        source: /sw/books/:slug
        destination: /sw/books/:slug.html
      - type: rewrite
        source: /sw/authors/:slug
        destination: /sw/authors/:slug.html
      - type: rewrite
        source: /sw/sermons
        destination: /sw/sermons.html
      - type: rewrite
        source: /sw/sermons/:slug
        destination: /sw/sermons/:slug.html
      - type: rewrite
        source: /sw/plans
        destination: /sw/plans.html
      - type: rewrite
        source: /sw/plans/:slug
        destination: /sw/plans/:slug.html
      - type: rewrite
        source: /lg
        destination: /lg.html
      - type: rewrite
        source: /lg/books
        destination: /lg/books.html
      - type: rewrite
        source: /lg/biographies
        destination: /lg/biographies.html
      - type: rewrite
        source: /lg/about
        destination: /lg/about.html
      - type: rewrite
        source: /lg/contact
        destination: /lg/contact.html
      - type: rewrite
        source: /lg/books/:slug
        destination: /lg/books/:slug.html
      - type: rewrite
        source: /lg/authors/:slug
        destination: /lg/authors/:slug.html
      - type: rewrite
        source: /lg/sermons
        destination: /lg/sermons.html
      - type: rewrite
        source: /lg/sermons/:slug
        destination: /lg/sermons/:slug.html
      - type: rewrite
        source: /lg/plans
        destination: /lg/plans.html
      - type: rewrite
        source: /lg/plans/:slug
        destination: /lg/plans/:slug.html
      # Everything else (the reader, search, /es/books/:slug/:order) falls back
      # to the SPA app shell.
      - type: rewrite
        source: /*
        destination: /200.html
    envVars:
      - key: PUBLIC_API_BASE_URL # the ochorus-api URL, after first deploy
        sync: false
      - key: PUBLIC_SITE_URL # public origin for canonical/OG/sitemap; the ochorus-web URL (or ochorus.com later)
        sync: false
      - key: PUBLIC_SUPABASE_URL # https://<project-ref>.supabase.co (enables login)
        sync: false
      - key: PUBLIC_SUPABASE_ANON_KEY # Supabase anon/publishable key (safe in the browser)
        sync: false
      - key: PUBLIC_SENTRY_DSN # optional: paste a Sentry DSN to turn on browser error monitoring
        sync: false
