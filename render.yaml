        destination: /covers/let-us-pray-2.svg
      - type: redirect
        source: /wp-content/uploads/2025/08/Body-of-Christ.jpg
        destination: /covers/the-body-of-christ-a-reality.svg
      - type: redirect
        source: /wp-content/uploads/2026/01/small-library-copy-3100.png
        destination: /covers/the-body-of-christ-teens.svg
      - type: redirect
        source: /wp-content/uploads/2025/08/Normal-Christian-Life.jpg
        destination: /covers/the-normal-christian-life.svg
      # INDEX pages: Render doesn't auto-map extensionless URLs to their .html
      # files, so map each one here.
      #
      # DETAIL pages (/books|authors|sermons|plans|topics /:slug) are NOT
      # rewritten. They prerender to <slug>/index.html, which Render serves for
      # the TRAILING-SLASH URL only; the no-slash form is 301'd to it below.
      # (An earlier comment here claimed Render resolves the no-slash form
      # natively and cited scripts/dir-style-detail.mjs — neither is true: the
      # script no longer exists, and production served a 3,953 b shell.)
      # A MISSING slug still matches no rule and falls to /* -> /200.html, so
      # the designed not-found page is preserved (gotcha #8).
      # scripts/dir-style-detail.mjs emits them as directory indexes
      # (<slug>/index.html), which Render serves natively for /books/:slug — so a
      # real book resolves to a file before any rule runs, while a MISSING or
      # unpublished slug matches no rule and falls through to the /* -> /200.html
      # SPA catch-all, which renders the designed not-found page. (A :slug ->
      # :slug.html rewrite instead served a blank empty-200 for a missing slug —
      # deploy skill, gotcha #8.)
      - type: rewrite
        source: /books
        destination: /books.html
      - type: rewrite
        source: /biographies
        destination: /biographies.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /legal
        destination: /legal.html
      - type: rewrite
        source: /sermons
        destination: /sermons.html
      - type: rewrite
        source: /plans
        destination: /plans.html
      # Localized (URL-prefixed) copies of the index pages. Render has no
      # wildcard for the locale segment, so each locale repeats the block above.
      # Keep these before the SPA catch-all.
      - type: rewrite
        source: /es
        destination: /es.html
      - type: rewrite
        source: /es/books
        destination: /es/books.html
      - type: rewrite
        source: /es/biographies
        destination: /es/biographies.html
      - type: rewrite
        source: /es/about
        destination: /es/about.html
      - type: rewrite
        source: /es/contact
        destination: /es/contact.html
      - type: rewrite
        source: /es/legal
        destination: /es/legal.html
      - type: rewrite
        source: /es/sermons
        destination: /es/sermons.html
      - type: rewrite
        source: /es/plans
        destination: /es/plans.html
      - type: rewrite
        source: /sw
        destination: /sw.html
      - type: rewrite
        source: /sw/books
        destination: /sw/books.html
      - type: rewrite
        source: /sw/biographies
        destination: /sw/biographies.html
      - type: rewrite
        source: /sw/about
        destination: /sw/about.html
      - type: rewrite
        source: /sw/contact
        destination: /sw/contact.html
      - type: rewrite
        source: /sw/legal
        destination: /sw/legal.html
      - type: rewrite
        source: /sw/sermons
        destination: /sw/sermons.html
      - type: rewrite
        source: /sw/plans
        destination: /sw/plans.html
      - type: rewrite
        source: /lg
        destination: /lg.html
      - type: rewrite
        source: /lg/books
        destination: /lg/books.html
      - type: rewrite
        source: /lg/biographies
        destination: /lg/biographies.html
      - type: rewrite
        source: /lg/about
        destination: /lg/about.html
      - type: rewrite
        source: /lg/contact
        destination: /lg/contact.html
      - type: rewrite
        source: /lg/legal
        destination: /lg/legal.html
      - type: rewrite
        source: /lg/sermons
        destination: /lg/sermons.html
      - type: rewrite
        source: /lg/plans
        destination: /lg/plans.html
      - type: rewrite
        source: /pt
        destination: /pt.html
      - type: rewrite
        source: /pt/books
        destination: /pt/books.html
      - type: rewrite
        source: /pt/biographies
        destination: /pt/biographies.html
      - type: rewrite
        source: /pt/about
        destination: /pt/about.html
      - type: rewrite
        source: /pt/contact
        destination: /pt/contact.html
      - type: rewrite
        source: /pt/legal
        destination: /pt/legal.html
      - type: rewrite
        source: /pt/sermons
        destination: /pt/sermons.html
      - type: rewrite
        source: /pt/plans
        destination: /pt/plans.html
      - type: rewrite
        source: /ar
        destination: /ar.html
      - type: rewrite
        source: /ar/books
        destination: /ar/books.html
      - type: rewrite
        source: /ar/biographies
        destination: /ar/biographies.html
      - type: rewrite
        source: /ar/about
        destination: /ar/about.html
      - type: rewrite
        source: /ar/contact
        destination: /ar/contact.html
      - type: rewrite
        source: /ar/legal
        destination: /ar/legal.html
      - type: rewrite
        source: /ar/sermons
        destination: /ar/sermons.html
      - type: rewrite
