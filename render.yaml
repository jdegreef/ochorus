# Render blueprint for Ochorus — deploys the API + reader from this repo.
# In Render: New → Blueprint → connect this GitHub repo. You'll be prompted to
# fill in the values marked `sync: false`. See DEPLOYMENT.md for the full walk-through.

# Preview environments: MANUAL, not automatic. A preview spins up a copy of
# BOTH services, and ochorus-api is a Docker web service on a paid plan — so
# `automatic` would launch (and bill) a full API preview on every PR, and the
# large majority of PRs here are content churn (bio translations, prerender
# refreshes) that need no preview at all. `manual` means a preview is created
# only when you ask for one — from the Render dashboard on a PR, or by
# commenting on the PR — which is exactly the "verify an infra/render.yaml
# change before it hits prod" case this exists for (e.g. the 404-status fix).
# Previews auto-delete after a few idle days so stale ones don't accumulate.
previews:
  generation: manual
  expireAfterDays: 3

services:
  # --- Django API (Docker web service) -------------------------------------
  - name: ochorus-api
    type: web
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # always-on; avoids cold-start spin-down
    healthCheckPath: /api/health/
    # Off: the deploy train (.github/workflows/deploy-train.yml) ships main in
    # batches every two hours, moving this service and ochorus-web to the same
    # green commit together (the email cron below auto-deploys on its own).
    # At 100+ merges a day, deploying each one queued the ~21-minute web build
    # back to back and rebuilt this image for every backend commit.
    #
    # This service and ochorus-web must share one trigger: the web build's gate
    # (frontend/scripts/await-api-release.mjs) waits for the API to serve the
    # same content. When only the API was "off" and the train's hook secrets
    # were missing (Oct 5–8, 2026), the API stopped deploying and every web
    # build timed out at that gate. To go back to per-merge deploys, set
    # `checksPass` on both, set DEPLOY_TRAIN below to "false", and comment
    # out the workflow's schedule (#5448 did exactly that).
    autoDeployTrigger: "off"
    # Rebuild the API only for commits that change what the image runs. The
    # rootDir already skips commits outside backend/; this also skips the ones
    # that touch only tests or backend/CLAUDE.md, each of which would otherwise
    # cost a Docker build plus a full `release` against Supabase. Paths are
    # repo-root relative, and a buildFilter replaces the rootDir default, so
    # `backend/**` has to be named.
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/**/tests*.py
        - backend/**/tests/**
        - backend/CLAUDE.md
    # Per deploy, before the new version goes live: apply migrations, then seed
    # the library from the committed fixture if (and only if) the DB is empty.
    # If this fails, Render keeps the current version up.
    preDeployCommand: "uv run python manage.py release"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates a strong secret
      - key: DATABASE_URL # Supabase session-pooler connection string
        sync: false
      - key: GITHUB_TRANSLATION_TOKEN # repo-scoped token for the translation job queue (issues read/write)
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: DJANGO_ALLOWED_HOSTS # the ochorus-api host, e.g. ochorus-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS # the ochorus-web URL, after first deploy
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # same frontend URL (used by the Django admin)
        sync: false
      # Optional: paste a Sentry DSN to turn on API error monitoring. Each report
      # is tagged with the deploy's commit automatically (Render sets
      # RENDER_GIT_COMMIT), so an error names the release that introduced it
      # rather than an undifferentiated "production".
      - key: SENTRY_DSN
        sync: false
      # Taking a language live triggers a rebuild of the READER: the site is
      # prerendered, so a status change alone changes nothing a reader sees.
      # Paste ochorus-web's Deploy Hook (that service → Settings → Deploy Hook).
      # Optional: unset means the admin records the launch and tells you plainly
      # that no deploy fired, rather than pretending it shipped.
      - key: RENDER_WEB_DEPLOY_HOOK
        sync: false
      # When "true", library/golive.py pins the reader rebuild it fires (on a
      # language launch, an import publish, a review approval) to this API's
      # commit. It does that by dispatching .github/workflows/rebuild-reader.yml,
      # which deploys ochorus-web at that commit through Render's REST API.
      # (Render 500s on a deploy hook carrying `ref=<sha>`, seen 2026-10-14.)
      # Only safe while the train keeps every service on one commit: under
      # per-merge auto-deploy the reader can be ahead of this API, and pinning
      # would roll it back, so set it "false" when going back to per-merge.
      - key: DEPLOY_TRAIN
        value: "true"
      # Starts that workflow. A fine-grained token with only `actions: write`
      # on this repo. Optional: unset uses GITHUB_TRANSLATION_TOKEN, so giving
      # that token `actions: write` is enough. If neither can dispatch, golive
      # fires the unpinned RENDER_WEB_DEPLOY_HOOK instead and says so.
      - key: GITHUB_DEPLOY_TOKEN
        sync: false
      # The reader's public origin (e.g. https://ochorus.com) — lets the admin
      # confirm after a deploy that a newly live locale is really in the built
      # sitemap. Optional: without it that check reports "unknown".
      - key: PUBLIC_SITE_URL
        sync: false
      # --- Email programme (Resend) ---------------------------------------
      # The `emails` app sends welcome/onboarding + broadcasts through Resend and
      # mirrors every open/click/bounce into its own tables. All optional until
      # the sending domain is verified: with EMAIL_ENABLED off (the default) the
      # pipeline records sends as "skipped" and contacts nobody.
      #
      # EMAIL_ENABLED: set to "true" to actually send, once news.<domain> is
      # verified in Resend with DKIM/SPF/DMARC.
      - key: EMAIL_ENABLED
        sync: false
      # Resend API key (secret) — the send credential.
      - key: RESEND_API_KEY
        sync: false
      # Resend/Svix webhook signing secret (whsec_…) — verifies inbound events.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # The From line, e.g. "Ochorus <hello@news.ochorus.com>".
      - key: EMAIL_FROM
        sync: false
      # Supabase service-role key — reads the reader's VERIFIED email from
      # auth.users (the source of truth for the address to send to).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional ISO cutoff: the welcome sweep only mails accounts created on or
      # after it, so a first run never blasts the back catalogue.
      - key: EMAIL_WELCOME_START
        sync: false
      # Review-mode safety net: comma-separated addresses (or "@domain"). When
      # SET, ONLY these receive mail — every reader is skipped — so you can turn
      # sending on and review test emails to yourself with zero risk. Clear to go
      # fully live.
      - key: EMAIL_ALLOWLIST
        sync: false

  # --- Lifecycle email cron (Phase 1) --------------------------------------
  # Runs the drip sweep on a timer, reusing the API's Docker image (no new
  # build). It shares the API's email + Supabase config via `fromService`, so the
  # cron and the API can never drift out of step (e.g. EMAIL_ENABLED on one but
  # not the other). With EMAIL_ENABLED off it records sends as "skipped" and
  # mails nobody. NOTE: render.yaml changes need a manual Blueprint → Sync.
  - name: ochorus-lifecycle-email
    type: cron
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "*/15 * * * *"
    # NOT on the train: Render gives cron jobs no deploy hook, so the train
    # cannot fire this one. Left "off" it would never deploy again and run a
    # stale image forever. So it deploys each green commit itself. That can put
    # it up to one train (~2 h) ahead of the API's migrations; it runs every
    # 15 minutes, so a run that trips on a not-yet-migrated column just fails
    # and the next one after the train succeeds. Nothing else depends on it.
    autoDeployTrigger: checksPass
    # Same filter as ochorus-api: the cron builds its own copy of the image, so
    # without this every test-only backend commit paid for a second Docker build.
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/**/tests*.py
        - backend/**/tests/**
        - backend/CLAUDE.md
    # A SINGLE management command that runs both steps in-process. Render runs a
    # cron dockerCommand argv-style (no shell) AND keeps literal quotes, so both a
    # bare `&&` ("unrecognized arguments: &&") and an `sh -c '…'` wrapper (status
    # 127: the quoted string treated as one command name) fail. No operators, no
    # quotes here — send_email_cron chains the two steps in Python.
    dockerCommand: "uv run python manage.py send_email_cron"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      # The command signs nothing, so its own generated secret is fine.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromService:
          name: ochorus-api
          type: web
          envVarKey: DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          name: ochorus-api
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          name: ochorus-api
          type: web
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: EMAIL_ENABLED
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_ENABLED
      - key: RESEND_API_KEY
        fromService:
          name: ochorus-api
          type: web
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_FROM
      - key: EMAIL_WELCOME_START
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_WELCOME_START
      # Same review-mode allowlist as the API, so the cron's drip is gated too.
      - key: EMAIL_ALLOWLIST
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_ALLOWLIST
      - key: PUBLIC_SITE_URL
        fromService:
          name: ochorus-api
          type: web
          envVarKey: PUBLIC_SITE_URL
      # The nightly content audit also rides this cron (send_email_cron →
      # `audit_scan --if-due`, once per UTC day at AUDIT_SCAN_HOUR_UTC, default
      # 3) and emails the super admins when a data-integrity check worsens.
      # Set ADMIN_EMAILS to the same comma-separated list as the API's, or the
      # alert goes to settings' built-in default address only.
      - key: ADMIN_EMAILS
        sync: false
      # The API's own public origin. The cron can't derive it (that comes from
      # the API service's RENDER_EXTERNAL_HOSTNAME), so set it to the API URL,
      # e.g. https://ochorus-api.onrender.com.
      - key: API_PUBLIC_URL
        sync: false

  # --- SvelteKit reader (static SPA) ---------------------------------------
  - name: ochorus-web
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    # Off, like ochorus-api (see there): the deploy train ships it, together
    # with the API, so the prebuild gate finds the content it waits for. The
    # buildFilter below still decides whether a train has anything to deploy.
    autoDeployTrigger: "off"
    # By default Render rebuilds this static service only when files under its
    # rootDir (frontend/) change — so a backend-only content commit (new authors,
    # book/title edits) would leave the prerendered /books|authors|sermons pages
    # stale until a MANUAL redeploy (deploy skill, gotcha #2). The paths below
    # are where the reader's content actually lives, so a change to any of them
    # triggers the rebuild that makes it visible.
    #
    # They are exactly the roots in backend/library/content_sources.json, and
    # tests_fixture fails if one is missing here. That matters because the
    # failure is silent: content this filter does not name ships to the API and
    # its pages keep the PREVIOUS prose until some unrelated commit happens to
    # trigger a build. Plan and topic prose spent time in that state after they
    # moved out of seed_plans.py into data/ and nothing was watching them.
    #
    # NOTE: render.yaml changes need a manual Blueprint → Sync (gotcha #3).
    buildFilter:
      paths:
        - frontend/**
        - backend/library/fixtures/content/**
        - backend/library/data/plan_translations/**
        - backend/library/data/topic_translations/**
        - backend/library/migrations/data/**
        # Single files, not trees: these two are Python seed modules, and a
        # `/**` over a Python package would sweep in __pycache__.
        - backend/library/topic_seed.py
        - backend/library/book_people_seed.py
        - backend/library/plan_seed.py
        - backend/library/quote_seed.py
        # apply_body_corrections runs on EVERY deploy and rewrites chapter and
        # sermon body_html from this file, so an added correction changes the
        # prose readers see — and, until this entry existed, changed nothing
        # about whether the reader rebuilt to show it.
        - backend/library/corrections.py
        # `credit()` reads this module and the book detail serializer emits it as
        # `artwork_credit`, so a curated entry is prose on a prerendered page —
        # the same shape as corrections.py above. Adding a painting happens to
        # touch frontend/ (the file itself), which hid this: the reader rebuilt
        # for the image, not for the credit. A change to `SOURCES` alone touches
        # no frontend path at all, and without this entry the credit line every
        # reader sees would never rebuild.
        - backend/library/curated_art.py
        # The book detail serializer emits `alternate_titles` from this module,
        # and the page both marks them up and prints them. Same shape as
        # curated_art.py: a curated entry here is prose on a prerendered page,
        # and it touches no frontend path, so without this entry a book would
        # keep answering to one name until an unrelated commit rebuilt it.
        - backend/library/alternate_titles.py
        # The fields every strip tile and search thumbnail carries so its cover
        # can set the title over a wordless ground (plan/topic/series fans are
        # prerendered): change what it emits and the reader must rebuild.
        - backend/library/cover_face.py
        # Computed at SERIALIZE time, not stored — so editing any of these
        # rewrites pages that are already on disk, with nothing else changing.
        # `annotate_references` wraps the Bible refs in every chapter and sermon
        # body (serializers.py calls it on `body_html`); `difficulty` is the
        # badge on a book page; scripture_graph feeds /scripture/**, which is
        # `prerender = true`. Two commits in the last 300 widened the citation
        # parser and neither rebuilt the reader.
        - backend/library/scripture.py
        - backend/library/scripture_graph.py
        # The bundled Open Word Bible text those two quote (scripts/build_owb_bible.py).
        - backend/library/data/bible/**
        - backend/library/readability.py
        # Same shape: the excerpt on every book page is chosen at serialize time
        # by this module's rules, not stored anywhere. Widening APPARATUS or
        # moving MAX_WORDS changes the opening paragraph 65 book pages show,
        # while touching no fixture and no frontend path.
        - backend/library/opening.py
        # Every field a prerendered page shows passes through here, so a new one
        # is new prose. #371 added `day_one` with no migration and still raced.
        # The cost is honest: ~17 of the last 300 commits touch this file and
        # most only change a query shape, so this trades some needless rebuilds
        # for never shipping a field the static pages do not have.
        - backend/library/serializers.py
        # `epub_url` (the book page's EPUB button) is read from this module's
        # EXPORT_PILOT at serialize time, so widening the pilot adds a button
        # to pages already on disk while touching no fixture or frontend.
        - backend/library/export_policy.py
        # A book's hand-written search snippet (its <meta description>) and the
        # public-domain rule behind its JSON-LD `license` — both baked into the
        # prerendered book and chapter pages.
        - backend/library/meta_descriptions.py
        - backend/library/data/book_meta/**
        - backend/library/rights.py
        # The biography hubs (/biographies/tradition|place/<slug>/): who is on
        # each, and each hub's name, intro and Q&A per language.
        - backend/library/hubs.py
        - backend/library/data/hubs/**
        # Printable leader's guides for the young-reader editions
        # (/books/<slug>/guide): the loader picks each chapter's verse and
        # prayer out of its body, and the data files carry the rest.
        - backend/library/leader_guides.py
        - backend/library/data/leader_guides/**
        # Which books are read by the calendar: the book page bakes the
        # "Today's reading" button from it.
        - backend/library/daily_books.py
    # --- Security headers ---------------------------------------------------
    # The reader had none. That matters more here than on a typical static site:
    # the Supabase access token lives in localStorage and is attached as a Bearer
    # to every API call, so any script that runs on this origin can read it — and
    # the reader renders server-stored HTML with {@html} in seven places.
    #
    # The Content-Security-Policy is NO LONGER a header here — it lives in
    # frontend/svelte.config.js (`kit.csp`, hash mode) and ships as a <meta> on
    # every prerendered page + the 200.html fallback. That is what lets script-src
    # drop 'unsafe-inline': a static header cannot carry the hash of SvelteKit's
    # per-build inline bootstrap, so a header CSP was stuck with 'unsafe-inline'
    # and leaned on connect-src alone. See that file for the directives and the
    # connect-src / Supabase / Plausible rationale; src/lib/csp.test.ts guards it.
    # The headers below are the non-CSP ones a <meta> cannot carry or that belong
    # at the edge — X-Frame-Options is now the sole clickjacking control (a <meta>
    # CSP cannot enforce frame-ancestors).
    #
    # ⚠️ render.yaml changes need a manual Blueprint → Sync (gotcha #3) — this
    # will NOT take effect on the next auto-deploy.
    headers:
      # The clickjacking control (a <meta> CSP cannot enforce frame-ancestors).
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Send the full URL same-origin, only the origin cross-origin — reader
      # paths name what someone is reading, which is not a referrer's business.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The reader needs none of these; denying them means an injected script
      # cannot prompt for them either.
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
      # Everything ships `max-age=0, s-maxage=300` today, which is right for HTML
      # (a prerendered page must revalidate so a redeploy is seen) but wasteful
      # for the build's own assets: files under /_app/immutable/ carry a content
      # hash in their name (Vite/SvelteKit renames them whenever their bytes
      # change), so the browser can hold them forever with no staleness risk.
      # Lighthouse reported "0 resources with an efficient cache policy" — this
      # is the fix, and it cuts the JS/CSS re-fetch off every repeat visit and
      # every SPA navigation. A more specific path wins over /* on Render, so
      # this overrides the blanket rule for these files only.
      #
      # The images (/covers, /portraits, /illustrations, /og) can NOT be `immutable`:
      # their names are STABLE (slug-based, not hashed), so a redrawn cover reuses
      # its URL — the cover level-up work repaints plates → paintings under the
      # same slug regularly. So they get a MODEST browser cache instead: an hour
      # ends the per-visit revalidation of the ~110 covers + portraits a shelf
      # loads, while `s-maxage=300` keeps the shared CDN fresh within five minutes
      # of a redraw's deploy, so a repeat visitor sees new art within the hour and
      # a first-time one immediately. (`max-age=0` re-validated every image on
      # every visit; the audit's "0 resources with an efficient cache policy".)
      #
      # `stale-while-revalidate` takes the wait out of that hour's end: past
      # max-age the browser paints the copy it holds AT ONCE and revalidates in
      # the background, instead of holding the shelf on ~110 round trips. The
      # price is one stale paint per expiry, and in this SPA that paint lasts the
      # session — client navigations reuse the document's in-memory image — so a
      # redraw reaches a returning reader on their NEXT full page load after the
      # hour, not on that one. A shared cache that honours SWR (the same header
      # reaches the CDN; Render cannot split them) likewise answers once from the
      # stale copy after s-maxage while it refetches, so a first-time visitor can
      # get one old cover per edge before the new one. Old art for a visit is the
      # whole cost; a browser without SWR (older Safari) behaves as before.
      #
      # Why not `?v=<hash>` URLs + `immutable` (tried on paper, 2026-10): these
      # rules match the PATH, never the query, so `immutable` on /covers/* would
      # also pin every UNversioned fetch of the same file for a year, in browsers
      # nobody can purge. Safe only if every emitter versions — and they are many
      # and partly out of the reader's hands: the API's `cover_url`/`photo_url`
      # rendered in ~50 files, srcsets and CSS backgrounds, `/illustrations/` srcs
      # inside stored chapter HTML, og:image twins, email blocks. The client would
      # also need a {path: hash} map of ~2,500 files in every page's bundle. One
      # missed emitter = a year-stale cover with no remedy, so the trade was not
      # taken. Hashed names (Vite's /_app/immutable/) are the safe way to that.
      - path: /_app/immutable/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /covers/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300, stale-while-revalidate=2592000"
      - path: /portraits/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300, stale-while-revalidate=2592000"
      # In-book pictures (chapter <figure>s): stable names, like the covers.
      - path: /illustrations/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300, stale-while-revalidate=2592000"
      # Topic emblems (TopicPill): regenerated by the topic-emblems skill under
      # the same names, so the covers' tier. They had no rule (max-age=0).
      - path: /emblems/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300, stale-while-revalidate=2592000"
      # Share cards: fetched by crawlers far more than by readers, and a crawler
      # re-scrapes on its own schedule — left as they were.
      - path: /og/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300"
      # Site chrome — app icons, the ornaments/emblems/seal in /marks (CSS
      # masks + fleurons on every page) and the paper grain in app.css
      # (/textures, every page; /marks and /textures had no rule, so max-age=0
      # revalidated them on every page view). Each is a generator's output or a
      # hand-drawn mark that changes perhaps once a year, so a WEEK in the
      # browser: a regenerated icon or ornament is seen within the week (plus
      # one view), and nothing here is content a reader could be misled by.
      - path: /icons/*
        name: Cache-Control
        value: "public, max-age=604800, s-maxage=300, stale-while-revalidate=2592000"
      - path: /marks/*
        name: Cache-Control
        value: "public, max-age=604800, s-maxage=300, stale-while-revalidate=2592000"
      - path: /textures/*
        name: Cache-Control
        value: "public, max-age=604800, s-maxage=300, stale-while-revalidate=2592000"

    routes:
      # ⚠️ No `/* -> /200.html` catch-all (see the end of this list), so a
      # no-slash detail URL (/books/<slug>) answers 404 to crawlers; the shell's
      # JavaScript still forwards readers to the slash form. Accepted 2026-09-30:
      # there is no Cloudflare zone for ochorus.com to hold the edge 301 in
      # docs/seo-edge-rules.md (DNS is at GoDaddy; Render's CDN isn't ours).
      #
      # KEEP THIS LIST SHORT. Render caps a static site at 200 redirect/rewrite
      # rules, and a rule deleted here is NOT deleted from the service: the sync
      # only adds and updates. Leftovers took ochorus-web to the cap, after which
      # every Blueprint sync failed (2026-10, the /vi and /ko pages never got
      # their rules). renderRoutes.test.ts holds this file to a small budget.
      # After REMOVING a rule here, run .github/scripts/render_replace_routes.py
      # (it replaces the service's list with this one via the API), then sync.
      #
      # One rule per path: Render's matcher is trailing-slash-insensitive, so
      # `source: /home` also catches `/home/` (verified live: /about/ serves
      # about.html, and there is no about/ directory).
      #
      # Old-site pages that still have inbound links. The WordPress media
      # (/wp-content/…), retired biography articles and deleted books had their
      # own 301s until 2026-10-13; Search Console showed no search traffic to any
      # of them in the 28 days before, and robots.txt already blocks /wp-content/.
      # They now get the not-found page, which has search and the library.
      - type: redirect
        source: /author-biographies
        destination: /biographies
      - type: redirect
        source: /ochorus-books
        destination: /books
      - type: redirect
        source: /about-us
        destination: /about
      - type: redirect
        source: /home
        destination: /
      # A reading plan that moved slug (migration 0172 reshaped its books and
      # renumbered its days; the new slug fences devices' old day numbers).
      - type: redirect
        source: /plans/the-key-teachings-four-teachers
        destination: /plans/key-teachings-four-teachers/
      # Book PDFs moved to Supabase Storage (2026-09-29). One wildcard keeps every
      # link shared before the move working. Render serves a file that exists
      # before any rule, so what still sits in frontend/static/pdfs is untouched.
      - type: redirect
        source: /pdfs/*
        destination: https://eywunobxqijvwymdzlwy.supabase.co/storage/v1/object/public/book-pdfs/*
      # The "Contemporary" era (undated writers) was folded into the modern
      # era. Localized /<lang>/ forms are redirected by the era page's load.
      - type: redirect
        source: /biographies/era/contemporary
        destination: /biographies/era/modern/
      # Ochorus Originals is the house imprint, not a person: its books moved
      # from an author page to their own shelf. Localized /<lang>/authors/
      # ochorus-originals/ URLs are redirected by the page's own load.
      - type: redirect
        source: /authors/ochorus-originals
        destination: /originals/
      # NO no-slash -> slash 301 here, deliberately. Render's route matcher is
      # trailing-slash-INSENSITIVE: a rule with `source: /about` also serves
      # `/about/` (verified live — there is no build/about/ directory, only
      # about.html). So `source: /books/:slug` would match `/books/<slug>/` too,
      # and for a path with NO prerendered file it would 301 the slashed URL to
      # itself — an infinite redirect loop. The 301 would have to live at an
      # edge we control (a Cloudflare zone for ochorus.com, which doesn't exist
      # today — docs/seo-edge-rules.md), so for now a no-slash detail URL gets
      # the 404 shell below, whose JavaScript still forwards a reader to the
      # slash form ($lib/canonicalRedirect). Crawlers see the 404; every link we
      # emit is slashed, so only old external backlinks lose the redirect.
      #
      # NO catch-all. A path with no prerendered file and no rule above gets
      # Render's /404.html — the same SPA shell as 200.html (postbuild copies
      # it; scripts/build-404.mjs), so a reader still gets the app's not-found
      # page, but crawlers get an honest 404 STATUS. The old `/* -> /200.html`
      # answered 200 for every typo'd slug, dead WordPress URL, out-of-range
      # chapter and untranslated `/es/books/<en-only>/` — soft 404s that Google
      # kept re-crawling instead of the real pages.
      #
      # Only the client-only app routes (prerender = false: admin, settings,
      # notebook, the reader…) still get the 200 shell, in every locale (the
      # `:lang` rules below). /login and /reset-password keep the
      # shell they always got (Render doesn't map /login to login.html). The
      # list lives in frontend/src/lib/shellRoutes.ts; shellRoutes.test.ts keeps
      # this block, that list and the route tree in step.
      #
      # These come FIRST: the `:lang` index rules further down would otherwise
      # catch the app's own two-segment routes (/admin/books, /admin/sermons,
      # /admin/search) and rewrite them to a .html that does not exist.
      - type: rewrite
        source: /admin
        destination: /200.html
      - type: rewrite
        source: /admin/*
        destination: /200.html
      - type: rewrite
        source: /settings
        destination: /200.html
      - type: rewrite
        source: /favorites
        destination: /200.html
      - type: rewrite
        source: /notebook
        destination: /200.html
      - type: rewrite
        source: /notebook/*
        destination: /200.html
      - type: rewrite
        source: /reading
        destination: /200.html
      - type: rewrite
        source: /welcome
        destination: /200.html
      - type: rewrite
        source: /today
        destination: /200.html
      - type: rewrite
        source: /today/*
        destination: /200.html
      - type: rewrite
        source: /login
        destination: /200.html
      - type: rewrite
        source: /reset-password
        destination: /200.html
      - type: rewrite
        source: /email/preferences/*
        destination: /200.html
      # Every other UI locale: ONE `:lang` placeholder rule per route, never a
      # copy per locale. The copies once took this service to 255 rules, past
      # Render's cap of 200, and every Blueprint sync failed until they went.
      - type: rewrite
        source: /:lang/admin
        destination: /200.html
      - type: rewrite
        source: /:lang/admin/*
        destination: /200.html
      - type: rewrite
        source: /:lang/settings
        destination: /200.html
      - type: rewrite
        source: /:lang/favorites
        destination: /200.html
      - type: rewrite
        source: /:lang/notebook
        destination: /200.html
      - type: rewrite
        source: /:lang/notebook/*
        destination: /200.html
      - type: rewrite
        source: /:lang/reading
        destination: /200.html
      - type: rewrite
        source: /:lang/welcome
        destination: /200.html
      - type: rewrite
        source: /:lang/today
        destination: /200.html
      - type: rewrite
        source: /:lang/today/*
        destination: /200.html
      - type: rewrite
        source: /:lang/login
        destination: /200.html
      - type: rewrite
        source: /:lang/reset-password
        destination: /200.html
      - type: rewrite
        source: /:lang/email/preferences/*
        destination: /200.html
      # INDEX pages: Render doesn't auto-map extensionless URLs to their .html
      # files, so map each one here.
      #
      # DETAIL pages (/books|authors|sermons|plans|topics /:slug) are NOT
      # rewritten. They prerender to <slug>/index.html, which Render serves for
      # the TRAILING-SLASH URL only (the no-slash form is not resolved to it —
      # production served a 3,953 b shell for it). A MISSING slug matches no
      # rule and gets /404.html, which renders the designed not-found page with
      # a real 404 status (see the end of this list). A :slug -> :slug.html
      # rewrite instead served a blank empty-200 for a missing slug — deploy
      # skill, gotcha #8.
      - type: rewrite
        source: /books
        destination: /books.html
      - type: rewrite
        source: /biographies
        destination: /biographies.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /legal
        destination: /legal.html
      - type: rewrite
        source: /sermons
        destination: /sermons.html
      - type: rewrite
        source: /plans
        destination: /plans.html
      # /search prerenders to an empty-state shell (see search/+page.ts). Without
      # this rewrite the built search.html is unreachable: /search matches no
      # rule and falls to /* -> /200.html, so the page 200s with the 4 KB app
      # shell — exactly the crawler-invisible state prerendering it was meant to
      # fix. Shipped that way in #725; the prerender was right, the route was
      # missing.
      - type: rewrite
        source: /search
        destination: /search.html
      - type: rewrite
        source: /topics
        destination: /topics.html
      # Each UI locale's landing page.
      - type: rewrite
        source: /es
        destination: /es.html
      - type: rewrite
        source: /sw
        destination: /sw.html
      - type: rewrite
        source: /lg
        destination: /lg.html
      - type: rewrite
        source: /pt
        destination: /pt.html
      - type: rewrite
        source: /ar
        destination: /ar.html
      - type: rewrite
        source: /hi
        destination: /hi.html
      - type: rewrite
        source: /uk
        destination: /uk.html
      - type: rewrite
        source: /fr
        destination: /fr.html
      - type: rewrite
        source: /am
        destination: /am.html
      - type: rewrite
        source: /vi
        destination: /vi.html
      - type: rewrite
        source: /ko
        destination: /ko.html
      # Each UI locale's index pages: one `:lang` rule per page (Render
      # substitutes the placeholder into the destination). A `:lang` that is not
      # a locale (`/x/books`) rewrites to a .html that does not exist and gets a
      # blank 200 rather than the 404 shell — nothing links to such paths. Real
      # two-segment pages are safe: a file always beats a rule, and the app's
      # client-only routes are matched first, above.
      - type: rewrite
        source: /:lang/books
        destination: /:lang/books.html
      - type: rewrite
        source: /:lang/biographies
        destination: /:lang/biographies.html
      - type: rewrite
        source: /:lang/about
        destination: /:lang/about.html
      - type: rewrite
        source: /:lang/contact
        destination: /:lang/contact.html
      - type: rewrite
        source: /:lang/legal
        destination: /:lang/legal.html
      - type: rewrite
        source: /:lang/sermons
        destination: /:lang/sermons.html
      - type: rewrite
        source: /:lang/plans
        destination: /:lang/plans.html
      - type: rewrite
        source: /:lang/search
        destination: /:lang/search.html
      - type: rewrite
        source: /:lang/topics
        destination: /:lang/topics.html
    envVars:
      - key: PUBLIC_API_BASE_URL # the ochorus-api URL, after first deploy
        sync: false
      - key: PUBLIC_SITE_URL # public origin for canonical/OG/sitemap; the ochorus-web URL (or ochorus.com later)
        sync: false
      - key: PUBLIC_SUPABASE_URL # https://<project-ref>.supabase.co (enables login)
        sync: false
      - key: PUBLIC_SUPABASE_ANON_KEY # Supabase anon/publishable key (safe in the browser)
        sync: false
      # Optional: paste a Sentry DSN to turn on browser error monitoring. Reports
      # carry the build's commit, baked in at build time (see vite.config.ts).
      # The build adds the DSN's ingest host to the CSP's connect-src by itself
      # (svelte.config.js), and the browser scrubs sign-in tokens and search
      # text from what it sends ($lib/sentryScrub).
      - key: PUBLIC_SENTRY_DSN
        sync: false
      # Optional, for readable browser stack traces: with all three set, the
      # build emits source maps, uploads them to Sentry and deletes them from
      # build/ (scripts/sentry-sourcemaps.mjs). Without them a trace is one
      # minified line. A failed upload warns and the deploy goes on. The token
      # is an Organization Token (Sentry → Settings → Developer Settings →
      # Organization Tokens), which can upload maps and nothing else. ORG and
      # PROJECT are the slugs in the project's URL.
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      # Optional: set to the site's Plausible property (its `data-domain`, e.g.
      # `ochorus.com`) to turn on cookieless pageview analytics. Unset = off, no
      # script loaded, no requests (see analytics.ts). The plausible.io host is
      # already in the CSP above; a self-hosted instance also needs a
      # PUBLIC_PLAUSIBLE_SRC var added (here or via the Render dashboard) and
      # that host swapped into the CSP. Cloud (the default) needs neither.
      - key: PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
      # Optional: Google One Tap sign-in for signed-out readers ($lib/oneTap).
      # The OAuth **Web client ID** (…apps.googleusercontent.com) that Supabase's
      # Google provider already uses. It is public by design. Unset = off: no
      # Google script, no prompt. Also needs https://ochorus.com under that
      # client's "Authorized JavaScript origins" in Google Cloud, and the ID
      # listed in Supabase → Auth → Providers → Google → Client IDs.
      - key: PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # How long the prebuild waits for ochorus-api to serve THIS commit's
      # content before prerendering (scripts/await-api-release.mjs). A content
      # commit deploys both services at once, and the static build reaches this
      # gate in ~1 min while the API's Docker build + migrate + seed can take
      # several minutes more — so the script's own 5-min default was timing out
      # and failing the web build even though the API was merely mid-deploy, not
      # broken. 15 min gives the API deploy comfortable headroom; waiting costs
      # only static-build minutes, whereas failing ships nothing.
      - key: API_RELEASE_TIMEOUT_MS
        value: "900000"
