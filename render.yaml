        destination: /books/godliness/
      - type: redirect
        source: /wp-content/uploads/2025/08/He-Holds-me-Tomorrows-Gareth-Evans-1.pdf
        destination: /books/he-holds-my-tomorrows/
      - type: redirect
        source: /wp-content/uploads/2025/12/A-Guide-on-How-to-Manage-a-Library-final.-1.pdf
        destination: /books/how-to-manage-a-library/
      - type: redirect
        source: /wp-content/uploads/2025/08/Humility-Andrew-Murray-2.pdf
        destination: /books/humility-2/
      - type: redirect
        source: /wp-content/uploads/2025/08/Jesus-Himself-Andrew-Murray-2.pdf
        destination: /books/jesus-himself-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/Lord-Teach-Us-to-Pray-Andrew-Murray.pdf
        destination: /books/lord-teach-us-to-pray-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-AND-WOMEN-WHO-GAVE-EVERYTHING-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/men-and-women-who-gave-everything-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-OF-PRAYER-BY-OCHORUS.pdf
        destination: /books/men-of-prayer-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-WHO-MOVED-HEAVEN-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/men-who-moved-heaven/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-WHO-TENDED-THE-FLOCK-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/men-who-tended-the-flock-2/
      - type: redirect
        source: /wp-content/uploads/2025/08/PRAYER-THE-PULSE-OF-LIFE.pdf
        destination: /books/prayer-the-pulse-of-life/
      - type: redirect
        source: /wp-content/uploads/2026/03/Purity-of-Heart-by-William-Booth.pdf
