      # client-only routes are matched first, above.
      - type: rewrite
        source: /:lang/books
        destination: /:lang/books.html
      - type: rewrite
        source: /:lang/biographies
        destination: /:lang/biographies.html
      - type: rewrite
        source: /:lang/about
        destination: /:lang/about.html
      - type: rewrite
