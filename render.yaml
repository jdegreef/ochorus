# Render blueprint for Ochorus — deploys the API + reader from this repo.
# In Render: New → Blueprint → connect this GitHub repo. You'll be prompted to
# fill in the values marked `sync: false`. See DEPLOYMENT.md for the full walk-through.

# Preview environments: MANUAL, not automatic. A preview spins up a copy of
# BOTH services, and ochorus-api is a Docker web service on a paid plan — so
# `automatic` would launch (and bill) a full API preview on every PR, and the
# large majority of PRs here are content churn (bio translations, prerender
# refreshes) that need no preview at all. `manual` means a preview is created
# only when you ask for one — from the Render dashboard on a PR, or by
# commenting on the PR — which is exactly the "verify an infra/render.yaml
# change before it hits prod" case this exists for (e.g. the 404-status fix).
# Previews auto-delete after a few idle days so stale ones don't accumulate.
previews:
  generation: manual
  expireAfterDays: 3

services:
  # --- Django API (Docker web service) -------------------------------------
  - name: ochorus-api
    type: web
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # always-on; avoids cold-start spin-down
    healthCheckPath: /api/health/
    autoDeploy: true
    # Per deploy, before the new version goes live: apply migrations, then seed
    # the library from the committed fixture if (and only if) the DB is empty.
    # If this fails, Render keeps the current version up.
    preDeployCommand: "uv run python manage.py release"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates a strong secret
      - key: DATABASE_URL # Supabase session-pooler connection string
        sync: false
      - key: GITHUB_TRANSLATION_TOKEN # repo-scoped token for the translation job queue (issues read/write)
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: DJANGO_ALLOWED_HOSTS # the ochorus-api host, e.g. ochorus-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS # the ochorus-web URL, after first deploy
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # same frontend URL (used by the Django admin)
        sync: false
      # Optional: paste a Sentry DSN to turn on API error monitoring. Each report
      # is tagged with the deploy's commit automatically (Render sets
      # RENDER_GIT_COMMIT), so an error names the release that introduced it
      # rather than an undifferentiated "production".
      - key: SENTRY_DSN
        sync: false
      # Taking a language live triggers a rebuild of the READER: the site is
      # prerendered, so a status change alone changes nothing a reader sees.
      # Paste ochorus-web's Deploy Hook (that service → Settings → Deploy Hook).
      # Optional: unset means the admin records the launch and tells you plainly
      # that no deploy fired, rather than pretending it shipped.
      - key: RENDER_WEB_DEPLOY_HOOK
        sync: false
      # The reader's public origin (e.g. https://ochorus.com) — lets the admin
      # confirm after a deploy that a newly live locale is really in the built
      # sitemap. Optional: without it that check reports "unknown".
      - key: PUBLIC_SITE_URL
        sync: false
      # --- Email programme (Resend) ---------------------------------------
      # The `emails` app sends welcome/onboarding + broadcasts through Resend and
      # mirrors every open/click/bounce into its own tables. All optional until
      # the sending domain is verified: with EMAIL_ENABLED off (the default) the
      # pipeline records sends as "skipped" and contacts nobody.
      #
      # EMAIL_ENABLED: set to "true" to actually send, once news.<domain> is
      # verified in Resend with DKIM/SPF/DMARC.
      - key: EMAIL_ENABLED
        sync: false
      # Resend API key (secret) — the send credential.
      - key: RESEND_API_KEY
        sync: false
      # Resend/Svix webhook signing secret (whsec_…) — verifies inbound events.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # The From line, e.g. "Ochorus <hello@news.ochorus.com>".
      - key: EMAIL_FROM
        sync: false
      # Supabase service-role key — reads the reader's VERIFIED email from
      # auth.users (the source of truth for the address to send to).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional ISO cutoff: the welcome sweep only mails accounts created on or
      # after it, so a first run never blasts the back catalogue.
      - key: EMAIL_WELCOME_START
        sync: false

  # --- Lifecycle email cron (Phase 1) --------------------------------------
  # Runs the drip sweep on a timer, reusing the API's Docker image (no new
  # build). It shares the API's email + Supabase config via `fromService`, so the
  # cron and the API can never drift out of step (e.g. EMAIL_ENABLED on one but
  # not the other). With EMAIL_ENABLED off it records sends as "skipped" and
  # mails nobody. NOTE: render.yaml changes need a manual Blueprint → Sync.
  - name: ochorus-lifecycle-email
    type: cron
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "*/15 * * * *"
    dockerCommand: "uv run python manage.py send_lifecycle_emails && uv run python manage.py send_due_broadcasts"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      # The command signs nothing, so its own generated secret is fine.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromService:
          name: ochorus-api
          type: web
          envVarKey: DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          name: ochorus-api
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          name: ochorus-api
          type: web
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: EMAIL_ENABLED
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_ENABLED
      - key: RESEND_API_KEY
        fromService:
          name: ochorus-api
          type: web
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_FROM
      - key: EMAIL_WELCOME_START
        fromService:
          name: ochorus-api
          type: web
          envVarKey: EMAIL_WELCOME_START
      - key: PUBLIC_SITE_URL
        fromService:
          name: ochorus-api
          type: web
          envVarKey: PUBLIC_SITE_URL
      # The API's own public origin. The cron can't derive it (that comes from
      # the API service's RENDER_EXTERNAL_HOSTNAME), so set it to the API URL,
      # e.g. https://ochorus-api.onrender.com.
      - key: API_PUBLIC_URL
        sync: false

  # --- SvelteKit reader (static SPA) ---------------------------------------
  - name: ochorus-web
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    # By default Render rebuilds this static service only when files under its
    # rootDir (frontend/) change — so a backend-only content commit (new authors,
    # book/title edits) would leave the prerendered /books|authors|sermons pages
    # stale until a MANUAL redeploy (deploy skill, gotcha #2). The paths below
    # are where the reader's content actually lives, so a change to any of them
    # triggers the rebuild that makes it visible.
    #
    # They are exactly the roots in backend/library/content_sources.json, and
    # tests_fixture fails if one is missing here. That matters because the
    # failure is silent: content this filter does not name ships to the API and
    # its pages keep the PREVIOUS prose until some unrelated commit happens to
    # trigger a build. Plan and topic prose spent time in that state after they
    # moved out of seed_plans.py into data/ and nothing was watching them.
    #
    # NOTE: render.yaml changes need a manual Blueprint → Sync (gotcha #3).
    buildFilter:
      paths:
        - frontend/**
        - backend/library/fixtures/content/**
        - backend/library/data/plan_translations/**
        - backend/library/data/topic_translations/**
        - backend/library/migrations/data/**
        # Single files, not trees: these two are Python seed modules, and a
        # `/**` over a Python package would sweep in __pycache__.
        - backend/library/topic_seed.py
        - backend/library/book_people_seed.py
        - backend/library/plan_seed.py
        - backend/library/quote_seed.py
        # apply_body_corrections runs on EVERY deploy and rewrites chapter and
        # sermon body_html from this file, so an added correction changes the
        # prose readers see — and, until this entry existed, changed nothing
        # about whether the reader rebuilt to show it.
        - backend/library/corrections.py
        # `credit()` reads this module and the book detail serializer emits it as
        # `artwork_credit`, so a curated entry is prose on a prerendered page —
        # the same shape as corrections.py above. Adding a painting happens to
        # touch frontend/ (the file itself), which hid this: the reader rebuilt
        # for the image, not for the credit. A change to `SOURCES` alone touches
        # no frontend path at all, and without this entry the credit line every
        # reader sees would never rebuild.
        - backend/library/curated_art.py
        # The book detail serializer emits `alternate_titles` from this module,
        # and the page both marks them up and prints them. Same shape as
        # curated_art.py: a curated entry here is prose on a prerendered page,
        # and it touches no frontend path, so without this entry a book would
        # keep answering to one name until an unrelated commit rebuilt it.
        - backend/library/alternate_titles.py
        # Computed at SERIALIZE time, not stored — so editing any of these
        # rewrites pages that are already on disk, with nothing else changing.
        # `annotate_references` wraps the Bible refs in every chapter and sermon
        # body (serializers.py calls it on `body_html`); `difficulty` is the
        # badge on a book page; scripture_graph feeds /scripture/**, which is
        # `prerender = true`. Two commits in the last 300 widened the citation
        # parser and neither rebuilt the reader.
        - backend/library/scripture.py
        - backend/library/scripture_graph.py
        - backend/library/readability.py
        # Same shape: the excerpt on every book page is chosen at serialize time
        # by this module's rules, not stored anywhere. Widening APPARATUS or
        # moving MAX_WORDS changes the opening paragraph 65 book pages show,
        # while touching no fixture and no frontend path.
        - backend/library/opening.py
        # Every field a prerendered page shows passes through here, so a new one
        # is new prose. #371 added `day_one` with no migration and still raced.
        # The cost is honest: ~17 of the last 300 commits touch this file and
        # most only change a query shape, so this trades some needless rebuilds
        # for never shipping a field the static pages do not have.
        - backend/library/serializers.py
        # `epub_url` (the book page's EPUB button) is read from this module's
        # EXPORT_PILOT at serialize time, so widening the pilot adds a button
        # to pages already on disk while touching no fixture or frontend.
        - backend/library/export_policy.py
    # --- Security headers ---------------------------------------------------
    # The reader had none. That matters more here than on a typical static site:
    # the Supabase access token lives in localStorage and is attached as a Bearer
    # to every API call, so any script that runs on this origin can read it — and
    # the reader renders server-stored HTML with {@html} in seven places.
    #
    # The Content-Security-Policy is NO LONGER a header here — it lives in
    # frontend/svelte.config.js (`kit.csp`, hash mode) and ships as a <meta> on
    # every prerendered page + the 200.html fallback. That is what lets script-src
    # drop 'unsafe-inline': a static header cannot carry the hash of SvelteKit's
    # per-build inline bootstrap, so a header CSP was stuck with 'unsafe-inline'
    # and leaned on connect-src alone. See that file for the directives and the
    # connect-src / Supabase / Plausible rationale; src/lib/csp.test.ts guards it.
    # The headers below are the non-CSP ones a <meta> cannot carry or that belong
    # at the edge — X-Frame-Options is now the sole clickjacking control (a <meta>
    # CSP cannot enforce frame-ancestors).
    #
    # ⚠️ render.yaml changes need a manual Blueprint → Sync (gotcha #3) — this
    # will NOT take effect on the next auto-deploy.
    headers:
      # The clickjacking control (a <meta> CSP cannot enforce frame-ancestors).
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Send the full URL same-origin, only the origin cross-origin — reader
      # paths name what someone is reading, which is not a referrer's business.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The reader needs none of these; denying them means an injected script
      # cannot prompt for them either.
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
      # Everything ships `max-age=0, s-maxage=300` today, which is right for HTML
      # (a prerendered page must revalidate so a redeploy is seen) but wasteful
      # for the build's own assets: files under /_app/immutable/ carry a content
      # hash in their name (Vite/SvelteKit renames them whenever their bytes
      # change), so the browser can hold them forever with no staleness risk.
      # Lighthouse reported "0 resources with an efficient cache policy" — this
      # is the fix, and it cuts the JS/CSS re-fetch off every repeat visit and
      # every SPA navigation. A more specific path wins over /* on Render, so
      # this overrides the blanket rule for these files only.
      #
      # The images (/covers, /portraits, /og, /icons) can NOT be `immutable`:
      # their names are STABLE (slug-based, not hashed), so a redrawn cover reuses
      # its URL — the cover level-up work repaints plates → paintings under the
      # same slug regularly. So they get a MODEST browser cache instead: an hour
      # ends the per-visit revalidation of the ~110 covers + portraits a shelf
      # loads, while `s-maxage=300` keeps the shared CDN fresh within five minutes
      # of a redraw's deploy, so a repeat visitor sees new art within the hour and
      # a first-time one immediately. (`max-age=0` re-validated every image on
      # every visit; the audit's "0 resources with an efficient cache policy".)
      - path: /_app/immutable/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /covers/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300"
      - path: /portraits/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300"
      - path: /og/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300"
      - path: /icons/*
        name: Cache-Control
        value: "public, max-age=3600, s-maxage=300"

    routes:
      # Legacy WordPress URLs (ochorus.com was a WordPress site before this app
      # took the domain). Book pages already share the app's /books/<slug>/ shape,
      # but the two index pages moved — 301 the old paths so inbound links and
      # search results don't 404. Both the trailing- and non-trailing-slash forms
      # are listed because Render matches the source path exactly. These come
      # first so they win before the SPA catch-all.
      - type: redirect
        source: /author-biographies
        destination: /biographies
      - type: redirect
        source: /author-biographies/
        destination: /biographies
      - type: redirect
        source: /ochorus-books
        destination: /books
      - type: redirect
        source: /ochorus-books/
        destination: /books
      # Two more of the old site's pages, found in Search Console on
      # 2026-08-02: /about-us/ and /home are still RANKING — 10 and 6
      # impressions in the first ten days, against 12 for the homepage — and
      # both answer 200 with the 4 KB shell, so every one of those was a
      # searcher landing on a blank page. /about-us/ also carries 179 of the
      # internal links Google has on file for this domain.
      - type: redirect
        source: /about-us
        destination: /about
      - type: redirect
        source: /about-us/
        destination: /about
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /home/
        destination: /
      # Books that no longer exist. All are indexed and one is still being
      # served in results (/books/a-king-in-a-manger-2/, 5 impressions), and
      # like everything else with no file behind it they answer 200 with the
      # shell. No title here is in the library or the sitemap, so there is no
      # equivalent page to send them to — /books is the honest destination: a
      # reader who searched the title lands on the shelf rather than nothing.
      #
      # how-to-manage-a-library was withdrawn (migration 0073), so its own PDF
      # redirect below could no longer point at the book page and moves here
      # too — the shelf is now the closest honest target for all three of its
      # indexed URLs.
      - type: redirect
        source: /books/a-king-in-a-manger-2
        destination: /books
      - type: redirect
        source: /books/a-king-in-a-manger-2/
        destination: /books
      - type: redirect
        source: /books/grace-for-grace-2
        destination: /books
      - type: redirect
        source: /books/grace-for-grace-2/
        destination: /books
      - type: redirect
        source: /books/how-to-manage-a-library
        destination: /books
      - type: redirect
        source: /books/how-to-manage-a-library/
        destination: /books
      - type: redirect
        source: /wp-content/uploads/2025/12/A-Guide-on-How-to-Manage-a-Library-final.-1.pdf
        destination: /books
      # --- Retired WordPress media -------------------------------------
      # The old site hotlinked book PDFs and covers from /wp-content/uploads/.
      # Those files are gone, but the URLs are still in search results and in
      # links people saved — and because of the /* -> /200.html catch-all at
      # the bottom they answer 200 with the app shell, which reads to a crawler
      # as a soft 404 rather than an honest move. Sources are recorded in
      # frontend/static/pdfs/SOURCES.md and in the rehost commit (#416).
      #
      # PDFs -> the book itself (26). The book page is the equivalent
      # content — the whole work, readable — which is what a 301 target should be.
      - type: redirect
        source: /wp-content/uploads/2026/02/Baptism-with-the-Holy-Spirit-1.pdf
        destination: /books/baptism-with-the-holy-spirit/
      - type: redirect
        source: /wp-content/uploads/2026/06/CLOTHED-WITH-STRENGTH-AND-DIGNITY-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/clothed-with-strength-and-dignity/
      - type: redirect
        source: /wp-content/uploads/2025/08/FEASTING-AT-THE-TABLE.pdf
        destination: /books/feasting-at-the-table/
      - type: redirect
        source: /wp-content/uploads/2026/07/GODLINESS-MRS.-CATHERINE-BOOTH.pdf
        destination: /books/godliness/
      - type: redirect
        source: /wp-content/uploads/2025/08/He-Holds-me-Tomorrows-Gareth-Evans-1.pdf
        destination: /books/he-holds-my-tomorrows/
      - type: redirect
        source: /wp-content/uploads/2025/08/Humility-Andrew-Murray-2.pdf
        destination: /books/humility-2/
      - type: redirect
        source: /wp-content/uploads/2025/08/Jesus-Himself-Andrew-Murray-2.pdf
        destination: /books/jesus-himself-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/Lord-Teach-Us-to-Pray-Andrew-Murray.pdf
        destination: /books/lord-teach-us-to-pray-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-AND-WOMEN-WHO-GAVE-EVERYTHING-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/men-and-women-who-gave-everything-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-OF-PRAYER-BY-OCHORUS.pdf
        destination: /books/men-of-prayer-2/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-WHO-MOVED-HEAVEN-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/men-who-moved-heaven/
      - type: redirect
        source: /wp-content/uploads/2026/06/MEN-WHO-TENDED-THE-FLOCK-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/men-who-tended-the-flock-2/
      - type: redirect
        source: /wp-content/uploads/2025/08/PRAYER-THE-PULSE-OF-LIFE.pdf
        destination: /books/prayer-the-pulse-of-life/
      - type: redirect
        source: /wp-content/uploads/2026/03/Purity-of-Heart-by-William-Booth.pdf
        destination: /books/purity-of-heart/
      - type: redirect
        source: /wp-content/uploads/2026/06/Rise-Up-Men-of-God-by-Ochorus.pdf
        destination: /books/rise-up-men-of-god-2/
      - type: redirect
        source: /wp-content/uploads/2025/08/Stepping-Stones-Gareth-Evans-1.pdf
        destination: /books/stepping-stones-2/
      - type: redirect
        source: /wp-content/uploads/2026/03/TALKS-TO-THE-FARMER-CHARLES-SPURGEON.pdf
        destination: /books/talks-to-the-farmer/
      - type: redirect
        source: /wp-content/uploads/2025/08/The-Christians-secret-of-a-happy-life.pdf
        destination: /books/the-christians-secret-of-a-happy-life-4/
      - type: redirect
        source: /wp-content/uploads/2026/04/God-of-All-Comfort-by-Hannah-Whitall-Smith.pdf
        destination: /books/the-god-of-all-comfort/
      - type: redirect
        source: /wp-content/uploads/2025/08/The-Inner-Chamber.pdf
        destination: /books/the-inner-chamber/
      - type: redirect
        source: /wp-content/uploads/2025/08/The-Key-in-my-Hand-Gareth-Evans-1.pdf
        destination: /books/the-key-in-my-hand/
      - type: redirect
        source: /wp-content/uploads/2025/08/THE-MASTERS-INDWELLING-ANDREW-MURRAY.pdf
        destination: /books/the-masters-indwelling/
      - type: redirect
        source: /wp-content/uploads/2025/09/The-Person-and-Work-of-the-Holy-Spirit-BB.pdf
        destination: /books/the-person-and-work-of-the-holy-spirit/
      - type: redirect
        source: /wp-content/uploads/2025/08/The-secret-of-guidance-by-Frederick-Brotherton-Meyer-2.pdf
        destination: /books/the-secret-of-guidance/
      - type: redirect
        source: /wp-content/uploads/2026/06/The-Unselfishness-of-God-by-Hannah-Whitall-Smith.pdf
        destination: /books/the-unselfishness-of-god/
      - type: redirect
        source: /wp-content/uploads/2026/06/WOMEN-WHO-MOVED-HEAVEN-BY-OCHORUS-MINISTRIES.pdf
        destination: /books/women-who-moved-heaven-2/
      # Not redirected, deliberately: these books are not published, so a 301
      # would land on the not-found page — worse than the shell it replaced.
      # Add a rule here when the book goes live:
      #   /wp-content/uploads/2025/08/Grace-For-Grace-By-Watchman-Nee-1.pdf -> /books/grace-for-grace-2/
      #   /wp-content/uploads/2026/02/IF-Amy-Carmichael.pdf -> /books/if/
      #   /wp-content/uploads/2025/08/Let-Us-Pray-WATCHMAN-NEE-1.pdf -> /books/let-us-pray-2/
      #   /wp-content/uploads/2025/08/The-Body-of-Christ-Watchman-Nee.pdf -> /books/the-body-of-christ-a-reality/
      #   /wp-content/uploads/2026/01/The-Body-of-Christ-teen-version-compilied.pdf -> /books/the-body-of-christ-teens/
      #   /wp-content/uploads/2025/08/The-Normal-Christian-Life-Watchman-Nee-2.pdf -> /books/the-normal-christian-life/
      # Covers -> the re-hosted image (6). Same resource, new home, so
      # these go to the file rather than to a page: an image URL that 301s to
      # HTML is a soft 404 for image search.
      - type: redirect
        source: /wp-content/uploads/2025/08/Grace-for-Grace-FB-Cover.jpg
        destination: /covers/grace-for-grace-2.svg
      - type: redirect
        source: /wp-content/uploads/2026/02/Artboard-1-copy-11-100.jpg
        destination: /covers/if.svg
      - type: redirect
        source: /wp-content/uploads/2025/08/66544dc564f9bec5388fc9f4_Screenshot-2024-05-27-120849-1.png
        destination: /covers/let-us-pray-2.svg
      - type: redirect
        source: /wp-content/uploads/2025/08/Body-of-Christ.jpg
        destination: /covers/the-body-of-christ-a-reality.svg
      - type: redirect
        source: /wp-content/uploads/2026/01/small-library-copy-3100.png
        destination: /covers/the-body-of-christ-teens.svg
      # ABOVE the rule, never inside it. `renderRoutes.test.ts` reads this file
      # positionally — `- type:` on one line, `source:` on the next,
      # `destination:` on the one after — and silently SKIPS any rule whose
      # three lines are interrupted. This comment sat between `source:` and
      # `destination:`, which quietly excluded this very rule from the
      # existence check it was written to describe.
      #
      # What it says: a retired cover's redirect follows the COVER, not the
      # filename. This one was repointed when the book was given a painting and
