        destination: /:lang/contact.html
      - type: rewrite
        source: /:lang/legal
        destination: /:lang/legal.html
      - type: rewrite
        source: /:lang/sermons
        destination: /:lang/sermons.html
      - type: rewrite
        source: /:lang/plans
        destination: /:lang/plans.html
      - type: rewrite
        source: /:lang/search
        destination: /:lang/search.html
      - type: rewrite
        source: /:lang/topics
        destination: /:lang/topics.html
    envVars:
      - key: PUBLIC_API_BASE_URL # the ochorus-api URL, after first deploy
        sync: false
      - key: PUBLIC_SITE_URL # public origin for canonical/OG/sitemap; the ochorus-web URL (or ochorus.com later)
        sync: false
      - key: PUBLIC_SUPABASE_URL # https://<project-ref>.supabase.co (enables login)
        sync: false
      - key: PUBLIC_SUPABASE_ANON_KEY # Supabase anon/publishable key (safe in the browser)
        sync: false
      # Optional: paste a Sentry DSN to turn on browser error monitoring. Reports
      # carry the build's commit, baked in at build time (see vite.config.ts).
      # The build adds the DSN's ingest host to the CSP's connect-src by itself
      # (svelte.config.js), and the browser scrubs sign-in tokens and search
      # text from what it sends ($lib/sentryScrub).
      - key: PUBLIC_SENTRY_DSN
        sync: false
      # Optional, for readable browser stack traces: with all three set, the
      # build emits source maps, uploads them to Sentry and deletes them from
      # build/ (scripts/sentry-sourcemaps.mjs). Without them a trace is one
      # minified line. A failed upload warns and the deploy goes on. The token
      # is an Organization Token (Sentry → Settings → Developer Settings →
      # Organization Tokens), which can upload maps and nothing else. ORG and
      # PROJECT are the slugs in the project's URL.
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      # Optional: set to the site's Plausible property (its `data-domain`, e.g.
      # `ochorus.com`) to turn on cookieless pageview analytics. Unset = off, no
      # script loaded, no requests (see analytics.ts). The plausible.io host is
      # already in the CSP above; a self-hosted instance also needs a
      # PUBLIC_PLAUSIBLE_SRC var added (here or via the Render dashboard) and
      # that host swapped into the CSP. Cloud (the default) needs neither.
      - key: PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
      # Optional: Google One Tap sign-in for signed-out readers ($lib/oneTap).
      # The OAuth **Web client ID** (…apps.googleusercontent.com) that Supabase's
      # Google provider already uses. It is public by design. Unset = off: no
      # Google script, no prompt. Also needs https://ochorus.com under that
      # client's "Authorized JavaScript origins" in Google Cloud, and the ID
      # listed in Supabase → Auth → Providers → Google → Client IDs.
      - key: PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # How long the prebuild waits for ochorus-api to serve THIS commit's
      # content before prerendering (scripts/await-api-release.mjs). A content
      # commit deploys both services at once, and the static build reaches this
      # gate in ~1 min while the API's Docker build + migrate + seed can take
      # several minutes more — so the script's own 5-min default was timing out
      # and failing the web build even though the API was merely mid-deploy, not
      # broken. 15 min gives the API deploy comfortable headroom; waiting costs
      # only static-build minutes, whereas failing ships nothing.
      - key: API_RELEASE_TIMEOUT_MS
        value: "900000"
